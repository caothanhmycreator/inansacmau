<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quản Trị Nhân Sự - Sắc Màu</title>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="js/config.js"></script>
  <script src="js/auth_guard.js"></script>
  <script src="js/sidebar_loader.js"></script> 
  <style>
    /* ========================================================
       1. GIAO DIỆN CHUNG & PC
       ======================================================== */
    :root { --primary: #2D5A27; --bg: #f4f7f6; --border: #e2e8f0; --accent: #3498db; }
    body { margin: 0; font-family: 'Segoe UI', sans-serif; background: var(--bg); display: flex; color: #333; }
    
    #sidebar-frame { width: 250px; height: 100vh; position: fixed; left: 0; top: 0; border: none; z-index: 999; transition: 0.3s; }
    .main-content { flex: 1; margin-left: 250px; padding: 30px; transition: 0.3s; min-width: 0; }
    
    .header { border-bottom: 2px solid var(--primary); padding-bottom: 15px; margin-bottom: 25px; display: flex; justify-content: space-between; align-items: flex-end; flex-wrap: wrap; gap: 15px; }
    .header-left { display: flex; flex-direction: column; gap: 10px; }
    .header-left-top { display: flex; align-items: center; gap: 15px; flex-wrap: wrap; }
    .header h2 { margin: 0; color: var(--primary); }
    
    .month-picker { padding: 8px 12px; border-radius: 8px; border: 1px solid #cbd5e1; font-weight: bold; outline: none; background: white; }
    .btn-add-staff { background: #27ae60; color: white; padding: 10px 20px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; box-shadow: 0 4px 6px rgba(39, 174, 96, 0.2); transition: 0.2s; display: flex; align-items: center; gap: 5px; }
    .btn-add-staff:hover { background: #219653; transform: translateY(-1px); }

    .admin-card { background: white; border-radius: 12px; padding: 20px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); border: 1px solid var(--border); margin-bottom: 25px; }
    
    /* Giao diện Header của Staff thay đổi theo hướng mở */
    .staff-header-wrapper { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 15px; padding-bottom: 15px; border-bottom: 1px dashed #cbd5e1; }
    .staff-info-main { display: flex; flex-direction: column; gap: 8px; }
    .staff-name { margin: 0; color: var(--primary); font-size: 20px; display: flex; align-items: center; gap: 10px; }
    
    .badge-group { display: flex; gap: 8px; flex-wrap: wrap; }
    .badge { padding: 4px 10px; border-radius: 20px; font-size: 11px; font-weight: 600; }
    .badge-salary { background: #e0f2fe; color: #0369a1; border: 1px solid #bae6fd; }
    .badge-type { background: #fef08a; color: #9a3412; border: 1px solid #fde047; }
    .badge-commission { background: #dcfce7; color: #166534; border: 1px solid #bbf7d0; }
    .badge-no-commission { background: #f1f5f9; color: #64748b; border: 1px solid #e2e8f0; }

    .staff-actions { display: flex; gap: 10px; }
    .btn { padding: 8px 15px; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; transition: 0.2s; font-size: 12px; }
    .btn-config { background: #f39c12; color: white; }
    .btn-finance { background: #8e44ad; color: white; width: 100%; margin-top: 15px; padding: 12px;}
    .btn-danger { background: #e74c3c; color: white; }

    /* Bảng chấm công giữ nguyên */
    .table-responsive { width: 100%; overflow-x: auto; border: 1px solid #e2e8f0; border-radius: 8px; background: white; }
    .attendance-table { width: 100%; border-collapse: collapse; font-size: 12px; min-width: 1100px; }
    .attendance-table th, .attendance-table td { border: 1px solid #e2e8f0; padding: 8px 4px; text-align: center; }
    .attendance-table th { background: #f1f5f9; color: #475569; position: sticky; top: 0; z-index: 10; }
    .attendance-table td input[type="checkbox"] { width: 22px; height: 22px; cursor: pointer; accent-color: var(--primary); }
    .shift-label { font-weight: bold; color: #64748b; background: #f8fafc !important; width: 60px; position: sticky; left: 0; z-index: 5; }

    .swal2-container { z-index: 20000 !important; }

    /* ========================================================
       2. MOBILE RESPONSIVE
       ======================================================== */
    @media (max-width: 768px) {
        #sidebar-frame { left: -250px; }
        .main-content { margin-left: 0 !important; padding: 15px; padding-top: 70px; overflow-x: hidden; }
        body.sidebar-open #sidebar-frame { left: 0; }
        
        .mobile-nav-btn { display: block; position: fixed; top: 10px; left: 10px; z-index: 1000; background: var(--primary); color: white; padding: 8px 12px; border: none; border-radius: 4px; }
        .header { flex-direction: column; align-items: flex-start; }
        .btn-add-staff { width: 100%; justify-content: center; }
        
        .staff-header-wrapper { flex-direction: column; gap: 15px; }
        .staff-actions { width: 100%; justify-content: flex-end; }
        .table-responsive { -webkit-overflow-scrolling: touch; }
        .swal2-popup { width: 95% !important; }
    }
    @media (min-width: 769px) { .mobile-nav-btn { display: none; } }
  </style>
</head>
<body>

  <div class="main-content">
    
    <div class="header">
      <div class="header-left">
        <div class="header-left-top">
            <h2>⚙️ QUẢN TRỊ NHÂN SỰ</h2>
            <input type="month" id="month-selector" class="month-picker" onchange="loadAllData()">
        </div>
        <p style="color: #666; font-size: 14px; margin: 0;">Quản lý hồ sơ, cấu hình lương & Chốt công</p>
      </div>
      <div>
        <button class="btn-add-staff" onclick="openStaffModal()">➕ THÊM NHÂN VIÊN</button>
      </div>
    </div>

    <div id="admin-container">
      <h3 style="color:#888; text-align: center; margin-top: 50px;">🔍 Đang nạp dữ liệu nhân sự...</h3>
    </div>
  </div>

  <script>
    const h = { 'apikey': window.SB_CONFIG.KEY, 'Authorization': `Bearer ${window.SB_CONFIG.KEY}`, 'Content-Type': 'application/json', 'Prefer': 'return=representation' };
    let listStaff = [];
    let listAttendance = [];

    async function notifyAdmin(title, message) {
      try {
        if (typeof window.guiThongBaoSacMau === 'function') {
          await window.guiThongBaoSacMau(title, message, "Admin", "Admin_Quan_Ly_Nhan_Su.html");
        }
      } catch (e) { console.error("Lỗi gửi thông báo:", e); }
    }

    document.addEventListener("DOMContentLoaded", () => {
      const now = new Date();
      document.getElementById('month-selector').value = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}`;
      loadAllData();
    });

    async function loadAllData() {
      const monthVal = document.getElementById('month-selector').value;
      const [year, month] = monthVal.split('-');
      const firstDay = `${year}-${month}-01`;
      
      const daysInMonth = new Date(year, month, 0).getDate();
      const lastDay = `${year}-${month}-${String(daysInMonth).padStart(2, '0')}`;

      try {
        // Lấy tất cả nhân viên trừ Admin, sắp xếp theo ID để danh sách ổn định
        const resEmp = await fetch(`${window.SB_CONFIG.URL}/rest/v1/DM_NhanVien?Vai_Tro=neq.Admin&select=*&order=id.asc`, { headers: h });
        listStaff = await resEmp.json();
        
        const resCC = await fetch(`${window.SB_CONFIG.URL}/rest/v1/NhatKy_ChamCong?Ngay=gte.${firstDay}&Ngay=lte.${lastDay}&select=*`, { headers: h });
        listAttendance = await resCC.json();
        
        renderAdminModule(year, month);
      } catch (e) { console.error(e); }
    }

    function renderAdminModule(year, month) {
      const container = document.getElementById('admin-container');
      const daysInMonth = new Date(year, month, 0).getDate();
      
      if(listStaff.length === 0) {
          container.innerHTML = '<h3 style="text-align:center; color:#888; margin-top:50px;">Chưa có dữ liệu nhân viên. Hãy thêm mới!</h3>';
          return;
      }

      container.innerHTML = listStaff.map(s => {
        let headerRow = `<tr><th class="shift-label">Ngày</th>`;
        let morningRow = `<tr><td class="shift-label">SÁNG</td>`;
        let afternoonRow = `<tr><td class="shift-label">CHIỀU</td>`;

        for (let d = 1; d <= daysInMonth; d++) {
            const dateStr = `${year}-${month}-${String(d).padStart(2, '0')}`;
            const dateObj = new Date(dateStr);
            const isWeekend = dateObj.getDay() === 0;
            const bg = isWeekend ? 'background:#fff1f0;' : '';
            headerRow += `<th style="${bg}">${d}<br><small>${getDayName(dateObj)}</small></th>`;
            
            const logS = findLog(s.id, dateStr, 'morning');
            const logC = findLog(s.id, dateStr, 'afternoon');
            
            morningRow += `<td style="${bg}"><input type="checkbox" ${logS ? 'checked' : ''} onchange="toggleAttendance(this, '${s.id}', '${s.Ho_Ten}', '${dateStr}', 'morning', '${logS?logS.id:''}')"></td>`;
            afternoonRow += `<td style="${bg}"><input type="checkbox" ${logC ? 'checked' : ''} onchange="toggleAttendance(this, '${s.id}', '${s.Ho_Ten}', '${dateStr}', 'afternoon', '${logC?logC.id:''}')"></td>`;
        }
        
        // Render thẻ cấu hình nhân sự
        const luongCbStr = s.Luong_Co_Ban ? Number(s.Luong_Co_Ban).toLocaleString('vi-VN') + 'đ' : 'Chưa nhập';
        const loaiLuongStr = s.Loai_Luong ? `Hệ ${s.Loai_Luong}` : 'Chưa thiết lập';
        const hoaHongBadge = s.Huong_Hoa_Hong === true 
            ? `<span class="badge badge-commission">✔️ Có Hoa Hồng</span>` 
            : `<span class="badge badge-no-commission">❌ Không Hoa Hồng</span>`;

        return `
          <div class="admin-card">
            <div class="staff-header-wrapper">
              <div class="staff-info-main">
                  <h3 class="staff-name">👤 ${s.Ho_Ten}</h3>
                  <div class="badge-group">
                      <span class="badge badge-salary">💰 Cơ bản: ${luongCbStr}</span>
                      <span class="badge badge-type">🏷️ ${loaiLuongStr}</span>
                      ${hoaHongBadge}
                  </div>
              </div>
              <div class="staff-actions">
                  <button class="btn btn-config" onclick='openStaffModal(${JSON.stringify(s)})'>⚙️ SỬA CẤU HÌNH</button>
              </div>
            </div>
            
            <div class="table-responsive"><table class="attendance-table">${headerRow}</tr>${morningRow}</tr>${afternoonRow}</tr></table></div>
            
            <button class="btn btn-finance" onclick="viewFinancials('${s.id}', '${s.Ho_Ten}')">🎁 QUẢN LÝ PHỤ CẤP / TẠM ỨNG / KÊ KHAI</button>
          </div>`;
      }).join('');
    }

    function getDayName(date) { return ["CN", "T2", "T3", "T4", "T5", "T6", "T7"][date.getDay()]; }

    function findLog(userId, day, shift) {
        return listAttendance.find(a => {
            const hour = parseInt(a.Gio_Vao.split(':')[0]);
            return String(a.User_ID) === String(userId) && a.Ngay === day && ((shift === 'morning' && hour < 12) || (shift === 'afternoon' && hour >= 12));
        });
    }

    // --- LOGIC CHẤM CÔNG (Giữ nguyên tính năng chống click đúp) ---
    async function toggleAttendance(checkbox, userId, empName, day, shift, existingId) {
        const shiftName = shift === 'morning' ? 'Sáng' : 'Chiều';
        checkbox.disabled = true;

        if (checkbox.checked) {
            const gioVao = shift === 'morning' ? "07:30:00" : "13:30:00";
            const gioRa = shift === 'morning' ? "11:30:00" : "17:30:00";
            await fetch(`${window.SB_CONFIG.URL}/rest/v1/NhatKy_ChamCong`, {
                method: 'POST', headers: h, body: JSON.stringify({ User_ID: userId, Ngay: day, Gio_Vao: gioVao, Gio_Ra: gioRa, Status: 'Đã về' })
            });
            await notifyAdmin("CẬP NHẬT CHẤM CÔNG", `Đã BỔ SUNG chấm công ca ${shiftName} ngày ${day} cho nhân viên ${empName}.`);
            loadAllData();
        } else {
            Swal.fire({ title: 'Xóa công?', text: 'Bạn muốn xóa ngày công này?', icon: 'warning', showCancelButton: true, confirmButtonText: 'XÓA', cancelButtonText: 'HỦY' }).then(async (result) => {
                if (result.isConfirmed) {
                    await fetch(`${window.SB_CONFIG.URL}/rest/v1/NhatKy_ChamCong?id=eq.${existingId}`, { method: 'DELETE', headers: h });
                    await notifyAdmin("CẬP NHẬT CHẤM CÔNG", `Đã XÓA BỎ chấm công ca ${shiftName} ngày ${day} của nhân viên ${empName}.`);
                    loadAllData();
                } else {
                    checkbox.checked = true;
                    checkbox.disabled = false;
                }
            });
        }
    }

    // --- MODULE: THÊM & SỬA HỒ SƠ NHÂN SỰ ---
    function openStaffModal(empData = null) {
        const isEdit = empData !== null;
        const title = isEdit ? `Chỉnh sửa: ${empData.Ho_Ten}` : 'Tạo Nhân Sự Mới';
        
        // Gán giá trị mặc định nếu sửa, rỗng nếu thêm mới
        const vName = isEdit ? empData.Ho_Ten : '';
        const vSalary = isEdit ? (empData.Luong_Co_Ban || 0) : '';
        const vType = isEdit ? empData.Loai_Luong : 'Tháng';
        const vComm = isEdit && empData.Huong_Hoa_Hong === true ? 'checked' : '';
        
        // Các trường đăng nhập (chỉ bắt buộc khi tạo mới)
        const accInfo = isEdit ? '' : `
            <hr style="border:0.5px dashed #ccc; margin: 15px 0;">
            <p style="font-size:12px; color:#e74c3c; margin:0 0 10px 0;">* Thông tin cấp quyền đăng nhập hệ thống:</p>
            <label style="font-weight:bold; display:block;">Tên đăng nhập (User):</label>
            <input id="sw-user" type="text" class="swal2-input" placeholder="VD: Nhanvienin..." style="margin-top:5px;">
            <label style="font-weight:bold; display:block; margin-top:10px;">Mật khẩu (Password):</label>
            <input id="sw-pass" type="text" class="swal2-input" placeholder="Nhập mật khẩu..." style="margin-top:5px;">
        `;

        Swal.fire({
            title: `<span style="font-size: 22px; color: var(--primary);">${title}</span>`,
            html: `
                <div style="text-align: left; font-size: 14px; padding: 0 10px;">
                    <label style="font-weight:bold; display:block;">Họ và Tên:</label>
                    <input id="sw-name" type="text" class="swal2-input" value="${vName}" placeholder="Nhập tên nhân viên..." style="margin-top:5px;">
                    
                    <label style="font-weight:bold; display:block; margin-top:10px;">Mức lương cơ bản (VNĐ):</label>
                    <input id="sw-salary" type="number" class="swal2-input" value="${vSalary}" placeholder="Nhập số tiền..." style="margin-top:5px;">
                    
                    <label style="font-weight:bold; display:block; margin-top:10px;">Hình thức tính lương:</label>
                    <select id="sw-type" class="swal2-input" style="margin-top:5px;">
                        <option value="Tháng" ${vType==='Tháng'?'selected':''}>Hệ Tháng (Theo công)</option>
                        <option value="Tuần" ${vType==='Tuần'?'selected':''}>Hệ Tuần (Theo buổi)</option>
                        <option value="Giờ" ${vType==='Giờ'?'selected':''}>Hệ Giờ (Part-time)</option>
                    </select>

                    <div style="margin-top: 15px; display: flex; align-items: center; gap: 10px; background: #f8fafc; padding: 10px; border-radius: 8px; border: 1px solid #e2e8f0;">
                        <input type="checkbox" id="sw-comm" style="width: 18px; height: 18px; cursor: pointer;" ${vComm}>
                        <label for="sw-comm" style="font-weight:bold; cursor:pointer; color: #166534; margin:0;">Nhân sự được hưởng % Hoa hồng</label>
                    </div>
                    
                    ${accInfo}
                </div>
            `,
            showCancelButton: true,
            confirmButtonText: 'LƯU HỒ SƠ',
            cancelButtonText: 'HỦY',
            confirmButtonColor: '#27ae60',
            width: '500px',
            preConfirm: () => {
                const name = document.getElementById('sw-name').value.trim();
                const salary = document.getElementById('sw-salary').value;
                if (!name) return Swal.showValidationMessage('Vui lòng nhập Tên nhân viên!');
                if (!salary) return Swal.showValidationMessage('Vui lòng nhập Mức lương cơ bản!');
                
                let payload = {
                    Ho_Ten: name,
                    Luong_Co_Ban: Number(salary),
                    Loai_Luong: document.getElementById('sw-type').value,
                    Huong_Hoa_Hong: document.getElementById('sw-comm').checked
                };

                if (!isEdit) {
                    const usr = document.getElementById('sw-user').value.trim();
                    const pwd = document.getElementById('sw-pass').value.trim();
                    if(!usr || !pwd) return Swal.showValidationMessage('Vui lòng cấp Tên đăng nhập và Mật khẩu!');
                    payload.User = usr;
                    payload.Password = pwd;
                    payload.Vai_Tro = "NhanVien"; // Default role
                }
                
                return payload;
            }
        }).then(async (result) => {
            if (result.isConfirmed) {
                try {
                    let url = `${window.SB_CONFIG.URL}/rest/v1/DM_NhanVien`;
                    let method = 'POST';
                    let logMsg = `Đã thêm nhân viên mới: ${result.value.Ho_Ten}`;
                    
                    if (isEdit) {
                        url += `?id=eq.${empData.id}`;
                        method = 'PATCH';
                        logMsg = `Đã cập nhật cấu hình lương cho: ${result.value.Ho_Ten}`;
                    }

                    const res = await fetch(url, { method: method, headers: h, body: JSON.stringify(result.value) });
                    if(res.ok) {
                        await notifyAdmin("CẬP NHẬT HỒ SƠ NHÂN SỰ", logMsg);
                        Swal.fire({ icon: 'success', title: 'Đã lưu thành công!', timer: 1500, showConfirmButton: false });
                        loadAllData();
                    } else {
                        throw new Error("Lỗi lưu DB");
                    }
                } catch (e) {
                    Swal.fire('Lỗi', 'Không thể lưu thông tin nhân sự. Vui lòng kiểm tra lại!', 'error');
                }
            }
        });
    }

    // --- MODULE: KÊ KHAI TÀI CHÍNH (Giữ nguyên) ---
    async function viewFinancials(empId, name) {
      const res = await fetch(`${window.SB_CONFIG.URL}/rest/v1/BienDong_TaiChinh?User_ID=eq.${empId}&order=Ngay_Ghi.desc&limit=20`, { headers: h });
      const fds = await res.json();
      let html = fds.map(f => {
        const dateDisplay = new Date(f.Ngay_Ghi).toLocaleString('vi-VN');
        return `
        <div style="display:flex; justify-content:space-between; align-items:center; padding:12px; border-bottom:1px solid #eee; text-align:left;">
          <div style="flex:1; padding-right:10px;">
            <b style="color:var(--primary)">${f.Loai}</b>: ${f.So_Tien.toLocaleString()}đ<br>
            <small style="color:#666;">Ngày: ${dateDisplay}</small><br>
            <small style="color:#888;">Nội dung: ${f.Noi_Dung || '...'}</small>
          </div>
          <div style="display:flex; gap:5px;">
            <button class="btn btn-edit" style="background:#3498db; padding:5px 8px; font-size:10px; width:auto; margin:0;" onclick='editFinanceItem(${JSON.stringify(f)}, "${name}")'>Sửa</button>
            <button class="btn btn-danger" style="padding:5px 8px; font-size:10px; width:auto; margin:0;" onclick="deleteFinance('${f.id}', '${name}', '${f.Loai}', ${f.So_Tien})">Xóa</button>
          </div>
        </div>`;
      }).join('');
      Swal.fire({ title: `<span style="font-size:18px;">TÀI CHÍNH: ${name}</span>`, html: `<div style="max-height:400px; overflow-y:auto; border:1px solid #eee; border-radius:8px;">${html || '<p style="padding:20px; color:#888;">Chưa có kê khai</p>'}</div>`, showConfirmButton: false, width: '650px', showCloseButton: true });
    }

    async function editFinanceItem(item, empName) {
        const d = new Date(item.Ngay_Ghi);
        const dateVal = d.toISOString().split('T')[0];
        const timeVal = d.toTimeString().split(' ')[0].substring(0,5);

        const { value: formValues } = await Swal.fire({
            title: 'Chỉnh sửa tài chính',
            html: `
                <div style="text-align:left; font-size:14px; padding: 0 5px;">
                    <label style="font-weight:bold; display:block; margin-top:10px;">Ngày ghi nhận:</label>
                    <input id="edit-date" type="date" class="swal2-input" value="${dateVal}">
                    <label style="font-weight:bold; display:block; margin-top:10px;">Giờ:</label>
                    <input id="edit-time" type="time" class="swal2-input" value="${timeVal}">
                    <label style="font-weight:bold; display:block; margin-top:10px;">Loại khoản:</label>
                    <select id="edit-loai" class="swal2-input">
                        <option value="Giao hàng" ${item.Loai==='Giao hàng'?'selected':''}>Giao hàng</option>
                        <option value="Nhận hàng" ${item.Loai==='Nhận hàng'?'selected':''}>Nhận hàng</option>
                        <option value="Khác" ${item.Loai==='Khác'?'selected':''}>Phụ cấp khác</option>
                        <option value="Tạm ứng" ${item.Loai==='Tạm ứng'?'selected':''}>Tạm ứng</option>
                    </select>
                    <label style="font-weight:bold; display:block; margin-top:10px;">Số tiền (VNĐ):</label>
                    <input id="edit-tien" type="number" class="swal2-input" value="${item.So_Tien}">
                    <label style="font-weight:bold; display:block; margin-top:10px;">Nội dung chi tiết:</label>
                    <input id="edit-noidung" type="text" class="swal2-input" value="${item.Noi_Dung || ''}">
                </div>
            `,
            focusConfirm: false,
            showCancelButton: true,
            confirmButtonText: 'LƯU THAY ĐỔI',
            cancelButtonText: 'HỦY',
            confirmButtonColor: '#2D5A27', 
            preConfirm: () => {
                return {
                    Ngay_Ghi: document.getElementById('edit-date').value + 'T' + document.getElementById('edit-time').value + ':00',
                    Loai: document.getElementById('edit-loai').value,
                    So_Tien: Number(document.getElementById('edit-tien').value),
                    Noi_Dung: document.getElementById('edit-noidung').value
                }
            }
        });

        if (formValues) {
            const res = await fetch(`${window.SB_CONFIG.URL}/rest/v1/BienDong_TaiChinh?id=eq.${item.id}`, {
                method: 'PATCH', headers: h, body: JSON.stringify(formValues)
            });
            if(res.ok) {
                await notifyAdmin("CẬP NHẬT KÊ KHAI TÀI CHÍNH", `Đã sửa khoản [${formValues.Loai} - ${formValues.Noi_Dung}] của ${empName} thành mức ${formValues.So_Tien.toLocaleString('vi-VN')} đ.`);
                Swal.fire({ icon: 'success', title: 'Đã cập nhật!', timer: 1000, showConfirmButton: false });
                loadAllData();
            }
        }
    }

    async function deleteFinance(id, empName, loaiStr, soTienNum) {
        Swal.fire({ title: 'Xóa khoản này?', text: 'Dữ liệu sẽ bị xóa vĩnh viễn!', icon: 'warning', showCancelButton: true, confirmButtonText: 'XÓA', cancelButtonText: 'HỦY', confirmButtonColor: '#e74c3c' }).then(async (r) => {
            if (r.isConfirmed) {
                await fetch(`${window.SB_CONFIG.URL}/rest/v1/BienDong_TaiChinh?id=eq.${id}`, { method: 'DELETE', headers: h });
                await notifyAdmin("XÓA KÊ KHAI TÀI CHÍNH", `Khoản [${loaiStr}] trị giá ${soTienNum.toLocaleString('vi-VN')} đ của nhân viên ${empName} đã bị xóa bỏ khỏi hệ thống.`);
                Swal.fire({ icon: 'success', title: 'Đã xóa!', timer: 800, showConfirmButton: false });
                loadAllData();
            }
        });
    }
  </script>
