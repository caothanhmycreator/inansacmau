<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quản Lý Giá Vốn - Sắc Màu</title>
  
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="js/config.js"></script>
  <script src="js/auth_guard.js"></script>
  <script src="js/sidebar_loader.js"></script> 
  <style>
    /* ========================================================
       1. GIAO DIỆN CHUNG & PC
       ======================================================== */
    :root { --primary: #2D5A27; --bg: #f4f7f6; --border: #e2e8f0; --accent: #c0392b; }
    body { margin: 0; font-family: 'Segoe UI', sans-serif; background: var(--bg); display: flex; }
    #sidebar-frame { width: 250px; height: 100vh; position: fixed; left: 0; top: 0; border: none; z-index: 999; transition: 0.3s; }
    .main-content { flex: 1; margin-left: 250px; padding: 25px; transition: 0.3s; min-width: 0; }

    .inventory-card { background: white; border-radius: 15px; padding: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); border-top: 5px solid var(--accent); }
    
    /* Layout 2 khung */
    .split-layout { display: flex; gap: 20px; align-items: flex-start; }
    .left-pane { flex: 0 0 420px; position: sticky; top: 20px; max-height: calc(100vh - 40px); overflow-y: auto; margin-top: 0 !important; }
    .right-pane { flex: 1; min-width: 0; margin-top: 0 !important; }
    
    /* Scrollbar cho left-pane */
    .left-pane::-webkit-scrollbar { width: 6px; }
    .left-pane::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 6px; }

    /* ĐÃ SỬA: Thiết kế thẻ vuông Nhóm chứa được 3 hàng dọc, kích thước nhỏ hơn 20% */
    .group-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
    .group-card { background: #fff; border: 1px solid #e2e8f0; border-radius: 10px; padding: 10px 5px; text-align: center; cursor: pointer; transition: 0.2s; border-bottom: 4px solid var(--primary); box-shadow: 0 2px 5px rgba(0,0,0,0.05); display: flex; flex-direction: column; align-items: center; justify-content: center; aspect-ratio: 1; }
    .group-card:hover { transform: translateY(-3px); box-shadow: 0 6px 12px rgba(0,0,0,0.1); border-color: var(--accent); border-bottom-color: var(--accent); }
    .group-card.active { border-color: var(--accent); border-bottom-color: var(--accent); background: #fdf2f2; }
    .group-icon { font-size: 22px; margin-bottom: 5px; }
    
    /* ĐÃ SỬA: Đổi tên class group-title thành price-group-title để không đụng Sidebar */
    .price-group-title { font-weight: bold; color: #2c3e50; font-size: 11.5px; line-height: 1.2; margin-bottom: 4px; text-align: center; }
    .group-count { font-size: 10px; color: #7f8c8d; background: #e2e8f0; padding: 2px 6px; border-radius: 8px;}

    /* Bảng dữ liệu */
    .table-modern { width: 100%; border-collapse: separate; border-spacing: 0; font-size: 13px; }
    .table-modern th { background: #f1f5f9; color: #64748b; font-size: 12px; text-transform: uppercase; padding: 12px; border-bottom: 2px solid #e2e8f0; text-align: left; }
    .table-modern td { padding: 12px; border-bottom: 1px solid #f1f5f9; vertical-align: middle; }
    .table-modern tr { transition: 0.2s; }
    .table-modern tr:hover { background: #f8fafc; }
    
    .price-badge-le { background: #e0f2fe; color: #0369a1; padding: 5px 10px; border-radius: 6px; font-weight: bold; display: inline-block; font-size: 13px; border: 1px solid #bae6fd; }

    .input-modern { padding: 8px 10px; border: 2px solid #cbd5e1; border-radius: 6px; outline: none; font-size: 14px; font-weight: bold; color: var(--accent); transition: 0.3s; width: 110px; text-align: right; }
    .input-modern:focus { border-color: var(--accent); box-shadow: 0 0 0 2px rgba(192, 57, 43, 0.1); }

    .img-preview { width: 50px; height: 50px; object-fit: cover; border-radius: 8px; border: 1px solid #ddd; cursor: pointer; transition: 0.2s; }
    .img-preview:hover { transform: scale(1.1); box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
    
    .btn-save { background: var(--accent); color: white; border: none; padding: 8px 15px; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 12px; transition: 0.3s; box-shadow: 0 2px 0 #922b21; }
    .btn-save:hover { background: #a93226; transform: translateY(1px); box-shadow: 0 1px 0 #922b21; }
    
    .btn-edit { background: #3498db; color: white; border: none; padding: 8px 15px; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 12px; transition: 0.3s; box-shadow: 0 2px 0 #2980b9; }
    .btn-edit:hover { background: #217dbb; transform: translateY(1px); box-shadow: 0 1px 0 #2980b9; }

    .swal2-container { z-index: 20000 !important; }

    /* Modal CSS cho tính năng cập nhật hàng chưa có giá */
    .custom-modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 10000; justify-content: center; align-items: center; padding: 15px; box-sizing: border-box;}
    .custom-modal.active { display: flex; }
    .modal-content { background: white; width: 100%; max-width: 1000px; max-height: 90vh; border-radius: 12px; display: flex; flex-direction: column; overflow: hidden; box-shadow: 0 10px 30px rgba(0,0,0,0.2); }
    .modal-header { padding: 15px 20px; background: #fdf2f2; border-bottom: 1px solid #fadbd8; display: flex; justify-content: space-between; align-items: center; }
    .modal-body { padding: 0 20px 20px 20px; overflow-y: auto; flex: 1; }
    .close-btn { background: none; border: none; font-size: 24px; cursor: pointer; color: #c0392b; line-height: 1; }

    /* Hiệu ứng trượt */
    @keyframes slideInRight {
        from { opacity: 0; transform: translateX(30px); }
        to { opacity: 1; transform: translateX(0); }
    }
    .slide-effect { animation: slideInRight 0.3s cubic-bezier(0.25, 0.8, 0.25, 1) forwards; }

    /* ========================================================
       2. MOBILE RESPONSIVE (ĐIỆN THOẠI)
       ======================================================== */
    @media (max-width: 768px) {
        #sidebar-frame { left: -250px; }
        .main-content { margin-left: 0 !important; padding: 15px; padding-top: 65px; }
        body.sidebar-open #sidebar-frame { left: 0; }
        
        .mobile-nav-btn {
            display: block; position: fixed; top: 10px; left: 10px; 
            z-index: 1000; background: var(--accent); color: white; 
            padding: 8px 12px; border: none; border-radius: 4px;
        }

        .header-top { flex-direction: column; align-items: flex-start !important; gap: 10px; }
        .header-title-box { flex-direction: column; align-items: flex-start !important; gap: 10px; }
        .header-top button { width: 100%; margin-left: 0 !important; }

        /* Chuyển 2 khung thành 1 cột */
        .split-layout { flex-direction: column; }
        .left-pane { flex: none; width: 100%; position: static; max-height: none; overflow-y: visible; }
        .group-grid { grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); }

        /* Biến bảng thành Card để tra cứu giá dễ dàng */
        .table-modern, .table-modern thead, .table-modern tbody, .table-modern th, .table-modern td, .table-modern tr { display: block; width: 100%; }
        .table-modern thead { display: none; }
        
        .table-modern tr { margin-bottom: 15px; border: 1px solid #e2e8f0; border-radius: 10px; padding: 10px; background: #fff; position: relative; box-shadow: 0 2px 5px rgba(0,0,0,0.02); }
        .table-modern td { border: none; padding: 8px 5px 8px 110px; position: relative; min-height: 35px; display: flex; align-items: center; justify-content: flex-start; text-align: left; }
        
        /* Nhãn hiển thị cột */
        .table-modern td:before { position: absolute; left: 10px; width: 95px; font-weight: bold; color: #64748b; font-size: 11px; text-transform: uppercase; content: attr(data-label); }
        
        .input-modern { width: 100%; box-sizing: border-box; text-align: left; }
        .btn-save, .btn-edit { width: 100%; padding: 12px; font-size: 14px; margin-top: 5px; }
    }

    @media (min-width: 769px) { .mobile-nav-btn { display: none; } }
  </style>
</head>
<body>

  <div class="main-content">
    <div class="header-top" style="margin-bottom: 20px;">
      <div class="header-title-box" style="display: flex; align-items: center;">
        <h2 style="margin:0; color: var(--accent); display: inline-block;">💰 QUẢN LÝ GIÁ VỐN & GIÁ BÁN</h2>
        <button onclick="showMissingPrices()" class="btn-save" style="margin-left: 15px; background:#e67e22; box-shadow: 0 2px 0 #d35400; padding:10px 15px; font-size:13px;">⚠️ CẬP NHẬT GIÁ CÒN THIẾU</button>
      </div>
      <p style="color: #666; font-size: 14px; margin: 5px 0 0 0;">Cập nhật giá gốc & giá bán trực tiếp để tự động tính lợi nhuận</p>
    </div>

    <div class="split-layout">
      <div class="left-pane inventory-card">
        <h3 style="margin-top:0; margin-bottom:15px; border-bottom: 2px solid #e2e8f0; padding-bottom:10px; color:#2c3e50;">📁 NHÓM SẢN PHẨM</h3>
        <div id="group-cards-container" class="group-grid"></div>
      </div>

      <div class="right-pane inventory-card">
        <div style="display:flex; justify-content: space-between; align-items: center; margin-bottom: 15px; flex-wrap: wrap; gap: 10px;">
          <h3 style="margin:0;" id="current-group-title">📊 SẢN PHẨM</h3>
          <div style="display: flex; gap: 10px; flex-wrap: wrap; flex: 1; justify-content: flex-end;">
            <input type="text" id="searchPrice" class="input-modern" placeholder="🔍 Tìm tên sản phẩm, mã..." style="max-width: 350px; flex: 1; text-align: left; font-weight: normal; color: #333;" onkeyup="filterPriceList()">
            <button onclick="loadGiaVonList()" style="background:none; border:none; color:var(--accent); cursor:pointer; font-weight:bold;">🔄 Tải lại</button>
          </div>
        </div>
        
        <div id="price-list-container">
          <p style="text-align:center; padding:20px; color:#888;">🔍 Đang tải dữ liệu...</p>
        </div>
      </div>
    </div>
  </div>

  <div id="missingModal" class="custom-modal">
    <div class="modal-content">
      <div class="modal-header">
        <h3 style="margin:0; color:var(--accent); display:flex; align-items:center; gap:10px;">⚠️ SẢN PHẨM CHƯA CẬP NHẬT GIÁ</h3>
        <button class="close-btn" onclick="closeMissingModal()">✖</button>
      </div>
      <div style="padding: 15px; border-bottom: 1px solid #e2e8f0; background: #fff;">
        <input type="text" id="searchMissing" class="input-modern" style="width:100%; max-width:100%; text-align:left; font-weight:normal; color:#333;" placeholder="🔍 Lọc nhanh trong danh sách này..." onkeyup="filterMissingPrices()">
      </div>
      <div class="modal-body">
        <table class="table-modern" style="margin-top:10px;">
          <thead>
            <tr>
              <th style="width:70px; text-align:center;">Ảnh</th>
              <th >Tên Sản Phẩm</th>
              <th style="width:100px;">Giá Bán Ra</th>
              <th style="width:100px;">Giá Vốn Nhập</th>
              <th style="width:100px; text-align:center;">Lợi Nhuận</th> 
              <th style="width:100px; text-align:center;">Thao tác</th>
            </tr>
          </thead>
          <tbody id="missing-table-body"></tbody>
        </table>
      </div>
    </div>
  </div>

  <script>
    let priceListData = [];
    let groupedData = {};
    let currentActiveGroup = null;

    document.addEventListener("DOMContentLoaded", () => {
      setTimeout(loadGiaVonList, 600);
    });

    function formatCurrency(input) {
      let v = input.value.replace(/\D/g, "");
      input.value = v.replace(/\B(?=(\d{3})+(?!\d))/g, ".");
    }
    
    function parseNum(s) { return Number(s.toString().replace(/\./g, "")) || 0; }

    // Tính Lợi Nhuận Realtime cho Bảng Chính
    window.calcProfit = function(id) {
        let gb = parseNum(document.getElementById(`inp-gb-${id}`).value);
        let gv = parseNum(document.getElementById(`inp-gv-${id}`).value);
        let ln = gb - gv;
        let el = document.getElementById(`txt-ln-${id}`);
        if(el) {
            el.innerText = ln.toLocaleString('vi-VN');
            el.style.color = ln >= 0 ? '#27ae60' : '#e74c3c';
        }
    }

    // Tính Lợi Nhuận Realtime cho Bảng Modal (Hàng thiếu giá)
    window.calcMissingProfit = function(id) {
        let gb = parseNum(document.getElementById(`m-gb-${id}`).value);
        let gv = parseNum(document.getElementById(`m-gv-${id}`).value);
        let ln = gb - gv;
        let el = document.getElementById(`m-ln-${id}`);
        if(el) {
            el.innerText = ln.toLocaleString('vi-VN');
            el.style.color = ln >= 0 ? '#27ae60' : '#e74c3c';
        }
    }

    // Kích hoạt animation slide-in
    function triggerSlideEffect() {
      const container = document.getElementById('price-list-container');
      container.classList.remove('slide-effect');
      void container.offsetWidth; // Trigger reflow để animation có thể chạy lại
      container.classList.add('slide-effect');
    }

    async function loadGiaVonList() {
      const h = { 'apikey': window.SB_CONFIG.KEY, 'Authorization': `Bearer ${window.SB_CONFIG.KEY}` };
      try {
        const res = await fetch(`${window.SB_CONFIG.URL}/rest/v1/Bang_Gia_San_Pham?select=Id,Ma_QR,Nhom_Hang,Ten_Hang,Don_Vi_Tinh,Gia_Ban,Gia_Von,Hinh_Anh&order=Nhom_Hang.asc`, { headers: h });
        priceListData = await res.json();
        
        buildGroups();
        document.getElementById('searchPrice').value = ""; // Reset search
      } catch (e) { console.error(e); }
    }

    function buildGroups() {
      groupedData = {};
      priceListData.forEach(item => {
        let nhom = item.Nhom_Hang || "Chưa phân loại";
        if (!groupedData[nhom]) groupedData[nhom] = [];
        groupedData[nhom].push(item);
      });

      renderGroupCards();
      
      // Mặc định chọn nhóm đầu tiên nếu có
      const groupKeys = Object.keys(groupedData).sort();
      if(groupKeys.length > 0) {
          selectGroup(groupKeys[0]);
      } else {
          document.getElementById('price-list-container').innerHTML = '<p style="text-align:center; padding:20px; color:#888;">Không có dữ liệu.</p>';
      }
    }

    function renderGroupCards() {
      const container = document.getElementById('group-cards-container');
      const keys = Object.keys(groupedData).sort();
      
      let html = keys.map(nhom => {
        return `
          <div class="group-card" id="card-${encodeURIComponent(nhom)}" onclick="selectGroup('${nhom.replace(/'/g, "\\'")}')">
            <div class="group-icon">📂</div>
            <div class="price-group-title">${nhom}</div>
            <div class="group-count">${groupedData[nhom].length} sản phẩm</div>
          </div>
        `;
      }).join('');
      
      container.innerHTML = html;
    }

    window.selectGroup = function(nhom) {
      currentActiveGroup = nhom;
      
      // Update UI active card
      document.querySelectorAll('.group-card').forEach(el => el.classList.remove('active'));
      let cardEl = document.getElementById(`card-${encodeURIComponent(nhom)}`);
      if(cardEl) cardEl.classList.add('active');

      document.getElementById('current-group-title').innerHTML = `DANH SÁCH: <span style="color:var(--primary);">${nhom.toUpperCase()}</span>`;
      
      // Clear search if any
      document.getElementById('searchPrice').value = "";
      
      triggerSlideEffect();
      renderMainTable(groupedData[nhom]);
    }

    // Popup xem ảnh lớn
    window.showImagePopup = function(imgUrl, title) {
        Swal.fire({
            title: title || 'Hình ảnh sản phẩm',
            imageUrl: imgUrl,
            imageWidth: 500, 
            imageAlt: 'Sản phẩm',
            showConfirmButton: true,
            confirmButtonText: 'Đóng',
            confirmButtonColor: '#34495e'
        });
    }

    function renderMainTable(data) {
        const container = document.getElementById('price-list-container');
        
        if(!data || data.length === 0) { 
            container.innerHTML = '<p style="text-align:center; padding:20px; color:#888;">Không tìm thấy sản phẩm nào.</p>'; 
            return; 
        }

        let rows = data.map(item => {
            let thumbDisplay = '<span style="color:#ccc">N/A</span>';
            if (item.Hinh_Anh && item.Hinh_Anh.includes('/d/')) {
                const fileId = item.Hinh_Anh.split('/d/')[1]?.split('/')[0];
                const finalThumb = `https://drive.google.com/thumbnail?id=${fileId}&sz=w200`;
                const largeImg = `https://drive.google.com/thumbnail?id=${fileId}&sz=w500`; 
                thumbDisplay = `<img src="${finalThumb}" class="img-preview" onclick="showImagePopup('${largeImg}', '${item.Ten_Hang.replace(/'/g, "\\'")}')" title="Click để xem lớn">`;
            } else if (item.Hinh_Anh) {
                thumbDisplay = `<img src="${item.Hinh_Anh}" class="img-preview" onclick="showImagePopup('${item.Hinh_Anh}', '${item.Ten_Hang.replace(/'/g, "\\'")}')" title="Click để xem lớn">`;
            }

            const loiNhuan = (item.Gia_Ban || 0) - (item.Gia_Von || 0);
            const lnColor = loiNhuan >= 0 ? '#27ae60' : '#e74c3c';

            return `
            <tr>
              <td data-label="Ảnh" style="text-align:center;">${thumbDisplay}</td>
              <td data-label="Tên hàng">
                <b style="font-size:14px; color:#2c3e50;">${item.Ten_Hang}</b><br>
                <small style="color:#7f8c8d">Mã: ${item.Ma_QR || 'N/A'} | ĐVT: ${item.Don_Vi_Tinh || '-'}</small>
              </td>
              <td data-label="Giá Bán Ra">
                <span id="txt-gb-${item.Id}" class="price-badge-le">${(item.Gia_Ban || 0).toLocaleString('vi-VN')}</span>
                <input type="text" id="inp-gb-${item.Id}" class="input-modern" style="display:none; color:#2980b9; border-color:#3498db;" value="${(item.Gia_Ban || 0).toLocaleString('vi-VN')}" oninput="formatCurrency(this); calcProfit(${item.Id});">
              </td>
              <td data-label="Giá Vốn">
                <span id="txt-gv-${item.Id}" style="font-weight:bold; color:var(--accent); font-size:14px;">${(item.Gia_Von || 0).toLocaleString('vi-VN')}</span>
                <input type="text" id="inp-gv-${item.Id}" class="input-modern" style="display:none;" value="${(item.Gia_Von || 0).toLocaleString('vi-VN')}" oninput="formatCurrency(this); calcProfit(${item.Id});">
              </td>
              <td data-label="Lợi Nhuận">
                <span id="txt-ln-${item.Id}" style="font-weight:bold; color:${lnColor}; font-size:14px; text-align:center">${loiNhuan.toLocaleString('vi-VN')}</span>
              </td>
              <td data-label="Thao tác" style="text-align: center;">
                <button onclick="editRow(${item.Id})" class="btn-edit" id="btn-edit-${item.Id}">✏️ SỬA</button>
                <button onclick="saveRow(${item.Id})" class="btn-save" id="btn-save-${item.Id}" style="display:none;">💾 LƯU</button>
              </td>
            </tr>`
        }).join('');

        container.innerHTML = `
          <table class="table-modern">
            <thead><tr>
                <th style="width:70px; text-align:center;">Ảnh</th>
                <th>Tên Sản Phẩm</th>
                <th style="width:110px;">Giá Bán Ra</th>
                <th style="width:110px;">Giá Vốn</th>
                <th style="width:110px">Lợi Nhuận</th>
                <th style="width:90px; text-align:center;">Thao tác</th>
            </tr></thead>
            <tbody>${rows}</tbody>
          </table>
        `;
    }

    window.filterPriceList = function() {
        const query = document.getElementById("searchPrice").value.toLowerCase().trim();
        
        if (query === "") {
            if(currentActiveGroup) selectGroup(currentActiveGroup);
            return;
        }

        document.querySelectorAll('.group-card').forEach(el => el.classList.remove('active'));
        document.getElementById('current-group-title').innerHTML = `KẾT QUẢ TÌM KIẾM: <span style="color:var(--accent);">${query}</span>`;

        const filteredData = priceListData.filter(item => {
            const ten = (item.Ten_Hang || "").toLowerCase();
            const ma = (item.Ma_QR || "").toLowerCase();
            const nhom = (item.Nhom_Hang || "").toLowerCase();
            return ten.includes(query) || ma.includes(query) || nhom.includes(query);
        });
        
        triggerSlideEffect();
        renderMainTable(filteredData);
    };

    // Hàm chuyển sang chế độ nhập
    window.editRow = function(id) {
        document.getElementById(`txt-gb-${id}`).style.display = 'none';
        document.getElementById(`txt-gv-${id}`).style.display = 'none';
        document.getElementById(`btn-edit-${id}`).style.display = 'none';
        
        document.getElementById(`inp-gb-${id}`).style.display = 'inline-block';
        document.getElementById(`inp-gv-${id}`).style.display = 'inline-block';
        document.getElementById(`btn-save-${id}`).style.display = 'inline-block';
    }

    // Hàm lưu giá đã chỉnh sửa
    window.saveRow = async function(id) {
        const inpGB = document.getElementById(`inp-gb-${id}`);
        const inpGV = document.getElementById(`inp-gv-${id}`);
        const btnSave = document.getElementById(`btn-save-${id}`);
        
        const newGB = parseNum(inpGB.value);
        const newGV = parseNum(inpGV.value);

        btnSave.innerText = "⏳...";
        btnSave.disabled = true;

        try {
            const h = { 'apikey': window.SB_CONFIG.KEY, 'Authorization': `Bearer ${window.SB_CONFIG.KEY}`, 'Content-Type': 'application/json' };
            const res = await fetch(`${window.SB_CONFIG.URL}/rest/v1/Bang_Gia_San_Pham?Id=eq.${id}`, { 
                method: 'PATCH', 
                headers: h, 
                body: JSON.stringify({ Gia_Ban: newGB, Gia_Von: newGV }) 
            });

            if (!res.ok) throw new Error("Không thể cập nhật cơ sở dữ liệu!");

            // Cập nhật local data
            const itemIndex = priceListData.findIndex(item => item.Id === id);
            if (itemIndex > -1) {
                priceListData[itemIndex].Gia_Ban = newGB;
                priceListData[itemIndex].Gia_Von = newGV;
            }

            // Phục hồi UI về chế độ xem
            document.getElementById(`txt-gb-${id}`).innerText = newGB.toLocaleString('vi-VN');
            document.getElementById(`txt-gv-${id}`).innerText = newGV.toLocaleString('vi-VN');

            document.getElementById(`inp-gb-${id}`).style.display = 'none';
            document.getElementById(`inp-gv-${id}`).style.display = 'none';
            btnSave.style.display = 'none';
            
            document.getElementById(`txt-gb-${id}`).style.display = 'inline-block';
            document.getElementById(`txt-gv-${id}`).style.display = 'inline-block';
            document.getElementById(`btn-edit-${id}`).style.display = 'inline-block';

            btnSave.innerText = "💾 LƯU";
            btnSave.disabled = false;

            Swal.fire({ toast: true, position: 'top-end', icon: 'success', title: 'Đã cập nhật giá!', showConfirmButton: false, timer: 1500 });
        } catch (error) {
            Swal.fire('Lỗi', error.message, 'error');
            btnSave.innerText = "❌ Lỗi";
            btnSave.disabled = false;
        }
    }


    /* ========================================================
       LOGIC CHO POPUP CẬP NHẬT GIÁ CÒN THIẾU
       ======================================================== */
    let missingPricesData = [];

    window.showMissingPrices = function() {
        missingPricesData = priceListData.filter(x => !x.Gia_Ban || !x.Gia_Von || x.Gia_Ban == 0 || x.Gia_Von == 0);
        document.getElementById('searchMissing').value = "";
        renderMissingTable(missingPricesData);
        document.getElementById('missingModal').classList.add('active');
    }

    window.closeMissingModal = function() {
        document.getElementById('missingModal').classList.remove('active');
        if(currentActiveGroup) {
            selectGroup(currentActiveGroup);
        } else {
            buildGroups();
        }
    }

    window.filterMissingPrices = function() {
        const query = document.getElementById("searchMissing").value.toLowerCase().trim();
        const filteredData = missingPricesData.filter(item => {
            const ten = (item.Ten_Hang || "").toLowerCase();
            const ma = (item.Ma_QR || "").toLowerCase();
            return ten.includes(query) || ma.includes(query);
        });
        renderMissingTable(filteredData);
    }

    function renderMissingTable(data) {
        const tbody = document.getElementById('missing-table-body');
        if(data.length === 0) {
            tbody.innerHTML = '<tr><td colspan="6" style="text-align:center; padding:20px; color:#27ae60; font-weight:bold;">Tuyệt vời! Tất cả sản phẩm đều đã có giá đầy đủ.</td></tr>';
            return;
        }

        tbody.innerHTML = data.map(item => {
            let thumbDisplay = '<span style="color:#ccc">N/A</span>';
            if (item.Hinh_Anh && item.Hinh_Anh.includes('/d/')) {
                const fileId = item.Hinh_Anh.split('/d/')[1]?.split('/')[0];
                const finalThumb = `https://drive.google.com/thumbnail?id=${fileId}&sz=w200`;
                const largeImg = `https://drive.google.com/thumbnail?id=${fileId}&sz=w500`; 
                thumbDisplay = `<img src="${finalThumb}" class="img-preview" onclick="showImagePopup('${largeImg}', '${item.Ten_Hang.replace(/'/g, "\\'")}')" title="Click để xem lớn">`;
            } else if (item.Hinh_Anh) {
                thumbDisplay = `<img src="${item.Hinh_Anh}" class="img-preview" onclick="showImagePopup('${item.Hinh_Anh}', '${item.Ten_Hang.replace(/'/g, "\\'")}')" title="Click để xem lớn">`;
            }

            const loiNhuan = (item.Gia_Ban || 0) - (item.Gia_Von || 0);
            const lnColor = loiNhuan >= 0 ? '#27ae60' : '#e74c3c';

            return `
            <tr id="row-missing-${item.Id}">
              <td data-label="Ảnh" style="text-align:center;">${thumbDisplay}</td>
              <td data-label="Tên hàng">
                <b style="font-size:14px; color:#2c3e50;">${item.Ten_Hang}</b><br>
                <small style="color:#7f8c8d">Mã: ${item.Ma_QR || 'N/A'}</small>
              </td>
              <td data-label="Giá Bán Ra">
                <input type="text" id="m-gb-${item.Id}" class="input-modern" style="color:#2980b9; border-color:#3498db; width:100%;" value="${(item.Gia_Ban || 0).toLocaleString('vi-VN')}" oninput="formatCurrency(this); calcMissingProfit(${item.Id});">
              </td>
              <td data-label="Giá Vốn">
                <input type="text" id="m-gv-${item.Id}" class="input-modern" style="width:100%;" value="${(item.Gia_Von || 0).toLocaleString('vi-VN')}" oninput="formatCurrency(this); calcMissingProfit(${item.Id});">
              </td>
              <td data-label="Lợi Nhuận">
                <span id="m-ln-${item.Id}" style="font-weight:bold; color:${lnColor}; font-size:14px;">${loiNhuan.toLocaleString('vi-VN')}</span>
              </td>
              <td data-label="Thao tác" style="text-align: center;">
                <button onclick="saveMissingRow(${item.Id})" class="btn-save" id="btn-m-save-${item.Id}" style="width:100%;">💾 LƯU</button>
              </td>
            </tr>`
        }).join('');
    }

    window.saveMissingRow = async function(id) {
        const inpGB = document.getElementById(`m-gb-${id}`);
        const inpGV = document.getElementById(`m-gv-${id}`);
        const btnSave = document.getElementById(`btn-m-save-${id}`);
        const trRow = document.getElementById(`row-missing-${id}`);
        
        const newGB = parseNum(inpGB.value);
        const newGV = parseNum(inpGV.value);

        if(newGB === 0 || newGV === 0) {
            Swal.fire({toast: true, position:'top-end', icon:'warning', title:'Giá vẫn bằng 0!', timer: 2000, showConfirmButton:false});
        }

        btnSave.innerText = "⏳...";
        btnSave.disabled = true;

        try {
            const h = { 'apikey': window.SB_CONFIG.KEY, 'Authorization': `Bearer ${window.SB_CONFIG.KEY}`, 'Content-Type': 'application/json' };
            const res = await fetch(`${window.SB_CONFIG.URL}/rest/v1/Bang_Gia_San_Pham?Id=eq.${id}`, { 
                method: 'PATCH', 
                headers: h, 
                body: JSON.stringify({ Gia_Ban: newGB, Gia_Von: newGV }) 
            });

            if (!res.ok) throw new Error("Cập nhật thất bại!");

            const itemIndex = priceListData.findIndex(item => item.Id === id);
            if (itemIndex > -1) {
                priceListData[itemIndex].Gia_Ban = newGB;
                priceListData[itemIndex].Gia_Von = newGV;
            }

            if(newGB > 0 && newGV > 0) {
                missingPricesData = missingPricesData.filter(x => x.Id !== id);
                trRow.style.opacity = '0';
                setTimeout(() => { trRow.remove(); }, 300);
            } else {
                btnSave.innerText = "✔ LƯU LẠI";
                btnSave.style.background = "#27ae60";
                btnSave.disabled = false;
            }

            Swal.fire({ toast: true, position: 'top-end', icon: 'success', title: 'Thành công!', showConfirmButton: false, timer: 1500 });
        } catch (error) {
            Swal.fire('Lỗi', error.message, 'error');
            btnSave.innerText = "❌ Lỗi";
            btnSave.disabled = false;
        }
    }
  </script>
</body>
