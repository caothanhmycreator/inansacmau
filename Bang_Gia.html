<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bảng Giá Sản Phẩm - Sắc Màu</title>
  
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="js/config.js"></script>
  <script src="js/auth_guard.js"></script>
  <script src="https://accounts.google.com/gsi/client" onload="initTokenClient()" async defer></script>
  <script src="js/sidebar_loader.js"></script> 
  <style>
    /* ========================================================
       1. GIAO DIỆN CHUNG & PC
       ======================================================== */
    :root { --primary: #2D5A27; --bg: #f4f7f6; --border: #e2e8f0; --accent: #d35400; }
    body { margin: 0; font-family: 'Segoe UI', sans-serif; background: var(--bg); display: flex; }
    #sidebar-frame { width: 250px; height: 100vh; position: fixed; left: 0; top: 0; border: none; z-index: 999; transition: 0.3s; }
    .main-content { flex: 1; margin-left: 250px; padding: 25px; transition: 0.3s; min-width: 0; box-sizing: border-box; }

    .form-card { background: white; padding: 25px; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); margin-bottom: 25px; border-top: 5px solid var(--accent); box-sizing: border-box; }
    
    .form-grid { display: grid; grid-template-columns: 1.2fr 2fr 1fr 0.8fr 1.5fr 1.5fr; gap: 12px; align-items: start; }
    
    .input-group { display: flex; flex-direction: column; }
    .input-group label { font-size: 12px; font-weight: bold; margin-bottom: 5px; color: #475569; text-transform: uppercase; }
    .input-modern { padding: 10px; border: 1px solid #cbd5e1; border-radius: 8px; outline: none; font-size: 14px; transition: 0.3s; height: 40px; box-sizing: border-box; }
    .input-modern:focus { border-color: var(--accent); box-shadow: 0 0 0 2px rgba(211, 84, 0, 0.1); }
    
    input[type="file"].input-modern { padding: 7px; font-size: 12px; }

    .inventory-card { background: white; border-radius: 15px; padding: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); box-sizing: border-box; }
    
    .split-layout { display: flex; gap: 20px; align-items: flex-start; box-sizing: border-box; }
    .left-pane { flex: 0 0 420px; position: sticky; top: 20px; max-height: calc(100vh - 40px); overflow-y: auto; margin-top: 0 !important; box-sizing: border-box; }
    .right-pane { flex: 1; min-width: 0; margin-top: 0 !important; box-sizing: border-box; }
    
    .left-pane::-webkit-scrollbar { width: 6px; }
    .left-pane::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 6px; }

    .group-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; box-sizing: border-box; width: 100%; }
    .group-card { background: #fff; border: 1px solid #e2e8f0; border-radius: 10px; padding: 10px 5px; text-align: center; cursor: pointer; transition: 0.2s; border-bottom: 4px solid var(--primary); box-shadow: 0 2px 5px rgba(0,0,0,0.05); display: flex; flex-direction: column; align-items: center; justify-content: center; aspect-ratio: 1; }
    .group-card:hover { transform: translateY(-3px); box-shadow: 0 6px 12px rgba(0,0,0,0.1); border-color: var(--accent); border-bottom-color: var(--accent); }
    .group-card.active { border-color: var(--accent); border-bottom-color: var(--accent); background: #fff5eb; }
    .group-icon { font-size: 22px; margin-bottom: 5px; }
    
    .price-group-title { font-weight: bold; color: #2c3e50; font-size: 11.5px; line-height: 1.2; margin-bottom: 4px; text-align: center; }
    .group-count { font-size: 10px; color: #7f8c8d; background: #e2e8f0; padding: 2px 6px; border-radius: 8px;}

    .table-modern { width: 100%; border-collapse: separate; border-spacing: 0; font-size: 13px; }
    .table-modern th { background: #f1f5f9; color: #64748b; font-size: 12px; text-transform: uppercase; padding: 12px; border-bottom: 2px solid #e2e8f0; text-align: left; }
    .table-modern td { padding: 12px; border-bottom: 1px solid #f1f5f9; vertical-align: middle; }
    .table-modern tr { transition: 0.2s; }
    .table-modern tr:hover { background: #f8fafc; }
    
    .price-badge-le { background: #fee2e2; color: #b91c1c; padding: 5px 10px; border-radius: 6px; font-weight: bold; display: inline-block; font-size: 13px; border: 1px solid #fecaca; }

    .img-preview { width: 50px; height: 50px; object-fit: cover; border-radius: 8px; cursor: pointer; border: 1px solid #ddd; transition: 0.2s; }
    .img-preview:hover { transform: scale(1.1); box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
    .qr-preview { width: 45px; height: 45px; cursor: pointer; background: white; padding: 3px; border: 1px solid #eee; border-radius: 6px; }
    
    .btn-submit { background: var(--accent); color: white; border: none; padding: 15px; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 14px; transition: 0.3s; flex: 1; }
    .btn-submit:hover { background: #a04000; transform: translateY(-2px); }
    
    .btn-import-kho { background: #2D5A27; color: white; border: none; padding: 15px; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 14px; transition: 0.3s; flex: 1; }
    .btn-import-kho:hover { background: #1e3f1a; transform: translateY(-2px); }
    
    .btn-import-dm { background: #2980b9; color: white; border: none; padding: 15px; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 14px; transition: 0.3s; flex: 1; }
    .btn-import-dm:hover { background: #1f618d; transform: translateY(-2px); }

    .btn-container { display: flex; gap: 15px; margin-top: 20px; width: 100%; flex-wrap: wrap; }
    .swal2-container { z-index: 20000 !important; }

    @keyframes slideInRight {
        from { opacity: 0; transform: translateX(30px); }
        to { opacity: 1; transform: translateX(0); }
    }
    .slide-effect { animation: slideInRight 0.3s cubic-bezier(0.25, 0.8, 0.25, 1) forwards; }

    /* ========================================================
       2. MOBILE RESPONSIVE (ĐIỆN THOẠI)
       ======================================================== */
    @media (max-width: 768px) {
        #sidebar-frame { left: -250px; }
        .main-content { margin-left: 0 !important; padding: 15px; padding-top: 65px; width: 100%; box-sizing: border-box; overflow-x: hidden; }
        body.sidebar-open #sidebar-frame { left: 0; }
        
        .mobile-nav-btn {
            display: block; position: fixed; top: 10px; left: 10px; 
            z-index: 1000; background: var(--accent); color: white; 
            padding: 8px 12px; border: none; border-radius: 4px;
        }

        .header-top { flex-direction: column; align-items: flex-start !important; gap: 10px; }
        .header-title-box { flex-direction: column; align-items: flex-start !important; gap: 10px; }
        .header-top button { width: 100%; margin-left: 0 !important; }

        .form-card { padding: 15px; width: 100%; box-sizing: border-box; overflow-x: hidden; }
        .form-grid { grid-template-columns: 1fr; }
        .btn-container { flex-direction: column; gap: 10px; }

        /* Chuyển 2 khung thành 1 cột ôm sát biên */
        .split-layout { flex-direction: column; width: 100%; }
        .left-pane { flex: none; width: 100%; position: static; max-height: none; overflow-y: visible; padding: 15px; box-sizing: border-box; }
        .right-pane { width: 100%; box-sizing: border-box; overflow-x: hidden; padding: 15px;}
        
        /* Nhóm sản phẩm thu gọn vừa khung */
        .group-grid { grid-template-columns: repeat(2, 1fr); gap: 10px; }

        .table-modern, .table-modern thead, .table-modern tbody, .table-modern th, .table-modern td, .table-modern tr { display: block; width: 100%; box-sizing: border-box; }
        .table-modern thead { display: none; }
        
        .table-modern tr { margin-bottom: 15px; border: 1px solid #e2e8f0; border-radius: 10px; padding: 10px; background: #fff; position: relative; box-shadow: 0 2px 5px rgba(0,0,0,0.02); }
        .table-modern td { border: none; padding: 8px 5px 8px 100px; position: relative; min-height: 35px; display: flex; align-items: center; justify-content: flex-start; text-align: left; word-break: break-word; }
        
        .table-modern td:before { position: absolute; left: 10px; width: 85px; font-weight: bold; color: #64748b; font-size: 11px; text-transform: uppercase; content: attr(data-label); }
        
        .img-preview { width: 60px; height: 60px; }
        .qr-preview { width: 50px; height: 50px; }

        /* Form Popup Chỉnh sửa vừa màn hình */
        .swal2-popup { width: 92% !important; padding: 15px 10px !important; border-radius: 12px !important; box-sizing: border-box; }
        
        .swal2-html-container div[style*="display: grid"] { grid-template-columns: 1fr !important; gap: 12px !important; }
        .swal2-html-container div[style*="grid-column: span"] { grid-column: span 1 !important; }
        
        /* Ép chuẩn Nhãn 1 dòng - Input 1 dòng */
        .swal2-html-container label { display: block; margin-bottom: 5px; text-align: left; }
        .swal2-input, .swal2-file { width: 100% !important; margin: 0 !important; box-sizing: border-box; }

        /* Nút LƯU - HỦY nằm ngang có icon */
        .swal2-actions { flex-direction: row !important; display: flex !important; gap: 10px; width: 100%; margin-top: 15px; }
        .swal2-actions button { flex: 1 !important; margin: 0 !important; padding: 12px !important; border-radius: 8px !important; width: auto !important; font-size: 15px !important; }

        /* CSS tùy chỉnh Bảng Swal nhập kho di động (responsive) */
        .responsive-swal-table table, .responsive-swal-table thead, .responsive-swal-table tbody, .responsive-swal-table th, .responsive-swal-table td, .responsive-swal-table tr { display: block; width: 100%; box-sizing: border-box; }
        .responsive-swal-table thead { display: none; }
        .responsive-swal-table tr { margin-bottom: 15px; border: 1px solid #e2e8f0; border-radius: 8px; padding: 10px; position: relative; background: #fff !important; }
        .responsive-swal-table td { border: none; padding: 8px 0; text-align: left !important; display: flex; flex-direction: column; align-items: flex-start; justify-content: center; }
        .responsive-swal-table td:before { font-weight: bold; color: #64748b; font-size: 11px; text-transform: uppercase; content: attr(data-label); margin-bottom: 5px; }
        .responsive-swal-table input, .responsive-swal-table button, .responsive-swal-table .swal2-input, .responsive-swal-table .swal2-file { width: 100% !important; margin: 0 !important; box-sizing: border-box; }
        .responsive-swal-table td > div { width: 100%; }
        
        .action-icon-container { display: flex; flex-direction: row !important; gap: 10px; width: 100%; }
        .action-icon-container button { flex: 1; height: 40px !important; margin-bottom: 0 !important; }
    }

    @media (min-width: 769px) { .mobile-nav-btn { display: none; } }
  </style>
</head>
<body>

  <div class="main-content">
    <div class="header-top" style="margin-bottom: 20px;">
      <div class="header-title-box" style="display: flex; align-items: center;">
        <h2 style="margin:0; color: var(--accent); display: inline-block;">🏷️ QUẢN LÝ BẢNG GIÁ SẮC MÀU</h2>
        <button onclick="getToken()" style="margin-left: 15px; padding:8px 15px; cursor:pointer; font-weight:bold; border-radius:8px; border:1px solid var(--accent); background:white; color:var(--accent); transition: 0.2s;">🔐 KẾT NỐI DRIVE</button>
      </div>
      <p style="color: #666; font-size: 14px; margin: 5px 0 0 0;">Cấu trúc chuẩn từ Kho - Đồng bộ mã sản phẩm</p>
    </div>

    <div class="form-card">
      <div class="form-grid">
        <div class="input-group">
          <label>Nhóm hàng</label>
          <input type="text" id="f-nhom" class="input-modern" placeholder="Vd: In Bạt...">
        </div>
        <div class="input-group">
          <label>Tên sản phẩm *</label>
          <input type="text" id="f-ten" class="input-modern" placeholder="Tên chi tiết SP...">
        </div>
        <div class="input-group">
          <label>Giá lẻ (VNĐ)</label>
          <input type="text" id="f-gia-ban" class="input-modern" value="0" oninput="formatCurrency(this)">
        </div>
        <div class="input-group">
          <label>Đơn vị tính</label>
          <input type="text" id="f-dvt" class="input-modern" placeholder="Vd: Cái, Bộ...">
        </div>
        <div class="input-group">
          <label>Mô tả / Quy cách</label>
          <input type="text" id="f-mota" class="input-modern" placeholder="Ghi chú...">
        </div>
        <div class="input-group">
          <label>Hình ảnh mẫu</label>
          <input type="file" id="f-hinh" class="input-modern" accept="image/*">
        </div>
      </div>
      <div class="btn-container">
        <button class="btn-import-kho" onclick="openKhoImportPopup()">📥 TỪ KHO VẬT TƯ</button>
        <button class="btn-import-dm" onclick="openDMImportPopup()">🔄 TỪ DANH MỤC CHỜ DUYỆT</button>
        <button class="btn-submit" onclick="submitPriceItem()">📤 XÁC NHẬN LƯU BẢNG GIÁ</button>
      </div>
    </div>

    <div class="split-layout">
      <div class="left-pane inventory-card">
        <h3 style="margin-top:0; margin-bottom:15px; border-bottom: 2px solid #e2e8f0; padding-bottom:10px; color:#2c3e50;">📁 NHÓM SẢN PHẨM</h3>
        <div id="group-cards-container" class="group-grid"></div>
      </div>

      <div class="right-pane inventory-card">
        <div style="display:flex; justify-content: space-between; align-items: center; margin-bottom: 15px; flex-wrap: wrap; gap: 10px;">
          <h3 style="margin:0;" id="current-group-title">📊 CHI TIẾT ĐƠN GIÁ</h3>
          <div style="display: flex; gap: 10px; flex-wrap: wrap; flex: 1; justify-content: flex-end;">
            <input type="text" id="searchPrice" class="input-modern" placeholder="🔍 Tìm tên, nhóm, mô tả, mã SP..." style="max-width: 350px; flex: 1;" onkeyup="filterPriceList()">
            <button onclick="loadPriceList()" style="background:none; border:none; color:var(--accent); cursor:pointer; font-weight:bold;">🔄 Làm mới bảng</button>
          </div>
        </div>
        
        <div id="price-list-container">
          <p style="text-align:center; padding:20px; color:#888;">🔍 Đang tải dữ liệu bảng giá...</p>
        </div>
      </div>
    </div>
  </div>

  <script>
    const CLIENT_ID = "139226878812-nuf4fl5sp2gvofgsgu7krtm89iqqgon6.apps.googleusercontent.com";
    const FOLDER_ID = "1ao2E97b8YdawmGb23c8U_6u7N65hTrVN"; 
    let accessToken = localStorage.getItem('drive_access_token');
    let tokenClient;
    
    let priceListData = [];
    let groupedData = {};
    let currentActiveGroup = null;

    function initTokenClient() {
        tokenClient = google.accounts.oauth2.initTokenClient({
            client_id: CLIENT_ID,
            scope: 'https://www.googleapis.com/auth/drive.file',
            callback: (tokenResponse) => {
                accessToken = tokenResponse.access_token;
                localStorage.setItem('drive_access_token', accessToken);
                Swal.fire({ icon: 'success', title: 'Drive đã sẵn sàng!', timer: 1000, showConfirmButton: false });
            },
        });
    }

    function getToken() { tokenClient.requestAccessToken(); }

    function formatCurrency(input) {
      let v = input.value.replace(/\D/g, "");
      input.value = v.replace(/\B(?=(\d{3})+(?!\d))/g, ".");
    }
    function parseNum(s) { return Number(s.toString().replace(/\./g, "")) || 0; }

    function triggerSlideEffect() {
      const container = document.getElementById('price-list-container');
      container.classList.remove('slide-effect');
      void container.offsetWidth; 
      container.classList.add('slide-effect');
    }

    document.addEventListener("DOMContentLoaded", () => {
      setTimeout(loadPriceList, 600);
    });

    async function uploadFileToDrive(file) {
        if (!accessToken) return null;
        try {
            const metadata = { name: `GIA_${Date.now()}_${file.name}`, parents: [FOLDER_ID] };
            const resInit = await fetch('https://www.googleapis.com/upload/drive/v3/files?uploadType=resumable&supportsAllDrives=true', {
                method: 'POST',
                headers: { 'Authorization': `Bearer ${accessToken}`, 'Content-Type': 'application/json' },
                body: JSON.stringify(metadata)
            });
            if(resInit.status === 401) { getToken(); return null; }
            const uploadUrl = resInit.headers.get('Location');
            const resUpload = await fetch(uploadUrl, { method: 'PUT', body: file });
            const result = await resUpload.json();
            return result.id ? `https://drive.google.com/file/d/${result.id}/view` : null;
        } catch (err) {
            console.error("Lỗi Drive:", err);
            return null;
        }
    }

    async function submitPriceItem() {
      const ten = document.getElementById('f-ten').value.trim();
      const nhom = document.getElementById('f-nhom').value.trim() || "Chưa phân loại";
      const file = document.getElementById('f-hinh').files[0];
      const giaBanRaw = document.getElementById('f-gia-ban').value;

      if(!ten) return Swal.fire('Lỗi', 'Vui lòng nhập tên sản phẩm!', 'warning');
      
      Swal.fire({ title: 'Đang kiểm tra & lưu...', allowOutsideClick: false, didOpen: () => Swal.showLoading() });

      try {
        const h = { 'apikey': window.SB_CONFIG.KEY, 'Authorization': `Bearer ${window.SB_CONFIG.KEY}`, 'Content-Type': 'application/json' };
        
        let maQR = "";
        let isDuplicate = true;
        while (isDuplicate) {
            maQR = "SMP-" + Math.random().toString(36).substr(2, 6).toUpperCase();
            const resCheck = await fetch(`${window.SB_CONFIG.URL}/rest/v1/Bang_Gia_San_Pham?Ma_QR=eq.${maQR}&select=Id`, { headers: h });
            const dataCheck = await resCheck.json();
            if (dataCheck.length === 0) isDuplicate = false;
        }

        let driveLink = "";
        if (file) driveLink = await uploadFileToDrive(file);

        await fetch(`${window.SB_CONFIG.URL}/rest/v1/Bang_Gia_San_Pham`, {
          method: 'POST', headers: h, body: JSON.stringify({
            Nhom_Hang: nhom, 
            Ten_Hang: ten, 
            Gia_Ban: parseNum(giaBanRaw),
            Gia_Si: 0, 
            Don_Vi_Tinh: document.getElementById('f-dvt').value,
            Mo_Ta: document.getElementById('f-mota').value,
            Hinh_Anh: driveLink,
            Ma_QR: maQR,
            Ghi_Chu: "" 
          })
        });

        try {
            const userObj = JSON.parse(localStorage.getItem('currentUser'));
            const userName = userObj?.Ho_Ten || userObj?.name || "Một tài khoản";
            const tbTitle = "THÊM SẢN PHẨM MỚI";
            const tbMsg = `${userName} vừa thêm sản phẩm ${ten} với giá ${parseNum(giaBanRaw).toLocaleString('vi-VN')}đ vào bảng giá.`;
            
            if (typeof window.guiThongBaoSacMau === 'function') {
                window.guiThongBaoSacMau(tbTitle, tbMsg, "Quan_Ly_Don", "Bang_Gia.html");
            } else if (typeof guiThongBaoSacMau === 'function') {
                guiThongBaoSacMau(tbTitle, tbMsg, "Quan_Ly_Don", "Bang_Gia.html");
            }
        } catch (etb) { console.error("Lỗi gửi thông báo:", etb); }

        Swal.fire('Thành công', `Đã lưu sản phẩm mã: ${maQR}`, 'success');
        document.getElementById('f-ten').value = "";
        document.getElementById('f-hinh').value = "";
        loadPriceList();
      } catch (e) { Swal.fire('Lỗi', e.message, 'error'); }
    }

    async function loadPriceList() {
      const h = { 'apikey': window.SB_CONFIG.KEY, 'Authorization': `Bearer ${window.SB_CONFIG.KEY}` };
      try {
        const res = await fetch(`${window.SB_CONFIG.URL}/rest/v1/Bang_Gia_San_Pham?select=*&order=Nhom_Hang.asc`, { headers: h });
        priceListData = await res.json();
        
        buildGroups();
        document.getElementById('searchPrice').value = "";
      } catch (e) { console.error(e); }
    }

    function buildGroups() {
      groupedData = {};
      priceListData.forEach(item => {
        let nhom = item.Nhom_Hang || "Chưa phân loại";
        if (!groupedData[nhom]) groupedData[nhom] = [];
        groupedData[nhom].push(item);
      });

      renderGroupCards();
      
      const groupKeys = Object.keys(groupedData).sort();
      if(groupKeys.length > 0) {
          if (currentActiveGroup && groupKeys.includes(currentActiveGroup)) {
              selectGroup(currentActiveGroup);
          } else {
              selectGroup(groupKeys[0]);
          }
      } else {
          document.getElementById('price-list-container').innerHTML = '<p style="text-align:center; padding:20px; color:#888;">Không có dữ liệu.</p>';
      }
    }

    function renderGroupCards() {
      const container = document.getElementById('group-cards-container');
      const keys = Object.keys(groupedData).sort();
      
      let html = keys.map(nhom => {
        return `
          <div class="group-card" id="card-${encodeURIComponent(nhom)}" onclick="selectGroup('${nhom.replace(/'/g, "\\'")}')">
            <div class="group-icon">📂</div>
            <div class="price-group-title">${nhom}</div>
            <div class="group-count">${groupedData[nhom].length} sản phẩm</div>
          </div>
        `;
      }).join('');
      
      container.innerHTML = html;
      container.style.display = 'grid'; 
    }

    window.selectGroup = function(nhom) {
      currentActiveGroup = nhom;
      
      document.querySelectorAll('.group-card').forEach(el => el.classList.remove('active'));
      let cardEl = document.getElementById(`card-${encodeURIComponent(nhom)}`);
      if(cardEl) cardEl.classList.add('active');

      document.getElementById('current-group-title').innerHTML = `DANH SÁCH: <span style="color:var(--primary);">${nhom.toUpperCase()}</span>`;
      
      document.getElementById('searchPrice').value = "";
      
      triggerSlideEffect();
      renderPriceTable(groupedData[nhom]);
    }

    window.renderPriceTable = function(data) {
        const container = document.getElementById('price-list-container');
        container.innerHTML = "";
        
        if(!data || data.length === 0) { 
            container.innerHTML = '<p style="text-align:center; padding:20px; color:#888;">Không tìm thấy sản phẩm nào.</p>'; 
            return; 
        }

        let rows = data.map(item => {
            const qrImageUrl = `https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=${encodeURIComponent(item.Ma_QR)}`;
            
            let thumbDisplay = '<span style="color:#ccc">N/A</span>';
            if (item.Hinh_Anh && item.Hinh_Anh.includes('/d/')) {
                const fileId = item.Hinh_Anh.split('/d/')[1]?.split('/')[0];
                const finalThumb = `https://drive.google.com/thumbnail?id=${fileId}&sz=w200`;

    window.filterPriceList = function() {
        const query = document.getElementById("searchPrice").value.toLowerCase().trim();
        const cardsContainer = document.getElementById('group-cards-container');
        
        if (query === "") {
            cardsContainer.style.display = 'grid';
            if(currentActiveGroup) selectGroup(currentActiveGroup);
            return;
        }

        cardsContainer.style.display = 'none';
        document.getElementById('current-group-title').innerHTML = `KẾT QUẢ TÌM KIẾM: <span style="color:var(--accent);">${query}</span>`;

        const filteredData = priceListData.filter(item => {
            const ten = (item.Ten_Hang || "").toLowerCase();
            const ma = (item.Ma_QR || "").toLowerCase();
            const nhom = (item.Nhom_Hang || "").toLowerCase();
            const mota = (item.Mo_Ta || "").toLowerCase();
            return ten.includes(query) || ma.includes(query) || nhom.includes(query) || mota.includes(query);
        });
        
        triggerSlideEffect();
        renderPriceTable(filteredData);
    };

    async function deletePrice(id) {
      const item = priceListData.find(x => x.Id === id);

      const r = await Swal.fire({ title: 'Xóa báo giá này?', icon: 'warning', showCancelButton: true, confirmButtonColor: '#d33', confirmButtonText: 'XÓA NGAY' });
      if (r.isConfirmed) {
        const h = { 'apikey': window.SB_CONFIG.KEY, 'Authorization': `Bearer ${window.SB_CONFIG.KEY}` };
        await fetch(`${window.SB_CONFIG.URL}/rest/v1/Bang_Gia_San_Pham?Id=eq.${id}`, { method: 'DELETE', headers: h });
        
        if (item) {
            try {
                const userObj = JSON.parse(localStorage.getItem('currentUser'));
                const userName = userObj?.Ho_Ten || userObj?.name || "Một tài khoản";
                const tbTitle = "XÓA SẢN PHẨM";
                const tbMsg = `${userName} vừa xóa sản phẩm ${item.Ten_Hang} khỏi bảng giá.`;
                
                if (typeof window.guiThongBaoSacMau === 'function') {
                    window.guiThongBaoSacMau(tbTitle, tbMsg, "Quan_Ly_Don", "Bang_Gia.html");
                } else if (typeof guiThongBaoSacMau === 'function') {
                    guiThongBaoSacMau(tbTitle, tbMsg, "Quan_Ly_Don", "Bang_Gia.html");
                }
            } catch (etb) { console.error("Lỗi gửi thông báo:", etb); }
        }

        loadPriceList();
      }
    }

    async function openKhoImportPopup() {
        Swal.fire({ title: 'Đang tải dữ liệu Kho...', allowOutsideClick: false, didOpen: () => Swal.showLoading() });
        const h = { 'apikey': window.SB_CONFIG.KEY, 'Authorization': `Bearer ${window.SB_CONFIG.KEY}` };

        try {
            const resKho = await fetch(`${window.SB_CONFIG.URL}/rest/v1/Kho_Vat_Tu?select=*`, { headers: h });
            const dataKho = await resKho.json();

            const resGia = await fetch(`${window.SB_CONFIG.URL}/rest/v1/Bang_Gia_San_Pham?select=Ghi_Chu`, { headers: h });
            const dataGia = await resGia.json();
            const maKhoDaCoGia = dataGia.map(item => item.Ghi_Chu).filter(m => m && m.startsWith('SMK-'));

            const vatTuMoi = dataKho.filter(vt => !maKhoDaCoGia.includes(vt.Ma_QR));

            if (vatTuMoi.length === 0) {
                return Swal.fire('Thông báo', 'Tất cả vật tư trong kho đều đã được niêm yết giá.', 'info');
            }

            let rowsHtml = vatTuMoi.map((vt, index) => {
                let thumbDisplay = '<span style="color:#ccc; font-size:11px;">N/A</span>';
                if (vt.Hinh_Anh && vt.Hinh_Anh.includes('/d/')) {
                    const fileId = vt.Hinh_Anh.split('/d/')[1]?.split('/')[0];
                    const finalThumb = `https://drive.google.com/thumbnail?id=${fileId}&sz=w200`;
                    thumbDisplay = `<img src="${finalThumb}" style="width: 40px; height: 40px; object-fit: cover; border-radius: 4px; cursor: pointer; border: 1px solid #ddd;" onclick="window.open('${vt.Hinh_Anh}', '_blank')" title="Mở ảnh Drive">`;
                } else if (vt.Hinh_Anh) {
                    thumbDisplay = `<img src="${vt.Hinh_Anh}" style="width: 40px; height: 40px; object-fit: cover; border-radius: 4px; cursor: pointer; border: 1px solid #ddd;" onclick="window.open('${vt.Hinh_Anh}', '_blank')" title="Mở ảnh">`;
                }

                return `
                <tr style="border-bottom: 1px solid #eee; background: #fff; transition: 0.2s;">
                    <td data-label="Ảnh" style="padding: 10px; text-align: center; vertical-align: middle;">${thumbDisplay}</td>
                    <td data-label="Tên Vật Tư" style="padding: 10px; text-align: left; vertical-align: middle; max-width: 150px;">
                        <b style="color: #2980b9; font-size: 13px;">${vt.Ten_Hang}</b><br>
                        <small style="color: gray;">Mã kho: ${vt.Ma_QR}</small>
                    </td>
                    <td data-label="ĐVT" style="padding: 10px; text-align: center; vertical-align: middle;">${vt.Quy_Cach || '-'}</td>
                    <td data-label="Giá Lẻ (Nhập tay)" style="padding: 10px; vertical-align: middle;">
                        <input type="text" id="imp-ban-${index}" class="swal2-input" placeholder="Giá lẻ..." style="width: 100%; margin: 0; font-size: 13px; height: 35px; border-radius: 6px; text-align:right;" oninput="formatCurrency(this)">
                    </td>
                </tr>
                `;
            }).join('');

            const { value: newDataToInsert, isConfirmed } = await Swal.fire({
                title: 'ĐỒNG BỘ GIÁ TỪ KHO',
                width: '700px',
                html: `
                    <div class="responsive-swal-table" style="max-height: 400px; overflow-y: auto; border-radius: 10px; border: 1px solid #e2e8f0;">
                        <table style="width: 100%; border-collapse: collapse; font-size: 14px;">
                            <thead style="position: sticky; top: 0; background: #2D5A27; color: white; z-index: 10;">
                                <tr>
                                    <th style="padding: 12px 10px; text-align: center; width: 60px;">Ảnh</th>
                                    <th style="padding: 12px 10px; text-align: left;">Tên Vật Tư</th>
                                    <th style="padding: 12px 10px; text-align: center; width: 80px;">ĐVT</th>
                                    <th style="padding: 12px 10px; width: 150px;">Giá Bán (Nhập tay)</th>
                                </tr>
                            </thead>
                            <tbody>${rowsHtml}</tbody>
                        </table>
                    </div>
                    <p style="color: red; font-size: 12px; margin-top: 10px; text-align: left;">* Lưu ý: Chỉ những dòng có nhập Giá Bán mới được lưu vào hệ thống.</p>
                `,
                showCancelButton: true,
                confirmButtonText: 'LƯU TẤT CẢ VÀO BẢNG GIÁ',
                confirmButtonColor: '#d35400',
                cancelButtonText: 'HỦY BỎ',
                preConfirm: () => {
                    const data = [];
                    for (let i = 0; i < vatTuMoi.length; i++) {
                        const elBan = document.getElementById(`imp-ban-${i}`);
                        if (!elBan) continue;

                        const giaBan = parseNum(elBan.value);
                        
                        if (giaBan > 0) {
                            let maQRSanPham = "SMP-" + Math.random().toString(36).substr(2, 6).toUpperCase();
                            data.push({
                                Nhom_Hang: vatTuMoi[i].Nhom_Hang,
                                Ten_Hang: vatTuMoi[i].Ten_Hang,
                                Gia_Ban: giaBan,
                                Gia_Si: 0,
                                Don_Vi_Tinh: vatTuMoi[i].Quy_Cach || 'Cái', 
                                Mo_Ta: vatTuMoi[i].Kich_Thuoc ? `KT: ${vatTuMoi[i].Kich_Thuoc}` : '',
                                Hinh_Anh: vatTuMoi[i].Hinh_Anh,
                                Ma_QR: maQRSanPham, 
                                Ghi_Chu: vatTuMoi[i].Ma_QR 
                            });
                        }
                    }
                    return data;
                }
            });

            if (isConfirmed && newDataToInsert) {
                if (newDataToInsert.length > 0) {
                    Swal.fire({ title: 'Đang đẩy dữ liệu lên hệ thống...', allowOutsideClick: false, didOpen: () => Swal.showLoading() });
                    
                    const postHeaders = { 
                        'apikey': window.SB_CONFIG.KEY, 
                        'Authorization': `Bearer ${window.SB_CONFIG.KEY}`,
                        'Content-Type': 'application/json',
                        'Prefer': 'return=minimal'
                    };

                    const response = await fetch(`${window.SB_CONFIG.URL}/rest/v1/Bang_Gia_San_Pham`, {
                        method: 'POST',
                        headers: postHeaders,
                        body: JSON.stringify(newDataToInsert)
                    });

                    if (!response.ok) {
                        const errInfo = await response.json();
                        throw new Error(errInfo.message || "Cơ sở dữ liệu từ chối gói thông tin!");
                    }

                    try {
                        const userObj = JSON.parse(localStorage.getItem('currentUser'));
                        const userName = userObj?.Ho_Ten || userObj?.name || "Một tài khoản";
                        const tbTitle = "CẬP NHẬT GIÁ TỪ KHO VẬT TƯ";
                        const tbMsg = `${userName} vừa cập nhật giá ${newDataToInsert.length} sản phẩm trong Kho vật tư vào bảng giá.`;
                        
                        if (typeof window.guiThongBaoSacMau === 'function') {
                            window.guiThongBaoSacMau(tbTitle, tbMsg, "Quan_Ly_Don", "Bang_Gia.html");
                        } else if (typeof guiThongBaoSacMau === 'function') {
                            guiThongBaoSacMau(tbTitle, tbMsg, "Quan_Ly_Don", "Bang_Gia.html");
                        }
                    } catch (etb) { console.error("Lỗi gửi thông báo:", etb); }

                    Swal.fire('Thành công', `Đã đồng bộ ${newDataToInsert.length} vật tư vào Bảng Giá.`, 'success');
                    loadPriceList();
                } else {
                    Swal.fire('Thông báo', 'Bạn chưa nhập giá cho vật tư nào nên không có gì được lưu.', 'info');
                }
            }

        } catch (error) {
            Swal.fire('Lỗi', error.message, 'error');
        }
    }

                                    <th style="padding: 12px 10px; width: 100px; text-align: right;">Giá Gốc</th>
                                    <th style="padding: 12px 10px; width: 130px;">Giá Bán Mới</th>
                                    <th style="padding: 12px 10px; text-align: center; width: 120px;">Tải ảnh Drive</th>
                                    <th style="padding: 12px 10px; text-align: center; width: 90px;">Thao tác</th>
                                </tr>
                            </thead>
                            <tbody>${rowsHtml}</tbody>
                        </table>
                    </div>
                    <p style="color: red; font-size: 12px; margin-top: 10px; text-align: left;">* Nhấn biểu tượng Lưu 💾 ở từng dòng để đẩy sản phẩm lên Bảng Giá.</p>
                `,
                showConfirmButton: false,
                showCancelButton: true,
                cancelButtonText: 'ĐÓNG',
                cancelButtonColor: '#666'
            });

        } catch (error) {
            Swal.fire('Lỗi hệ thống', error.message, 'error');
        }
    }

    window.saveSingleItemFromDM = async function(index, spId) {
        const btn = document.getElementById(`dm-btn-${index}`);
        const nhom = document.getElementById(`dm-nhom-${index}`).value.trim() || "SẢN PHẨM KHÁC";
        const ten = document.getElementById(`dm-ten-${index}`).value.trim();
        const giaBan = parseNum(document.getElementById(`dm-ban-${index}`).value);
        const dvt = document.getElementById(`dm-dvt-${index}`).value;
        const mota = ""; 
        const fileInput = document.getElementById(`dm-file-${index}`);

        if (giaBan <= 0) {
            Swal.fire({
                toast: true, position: 'top-end', icon: 'warning',
                title: 'Vui lòng nhập giá bán lớn hơn 0!', showConfirmButton: false, timer: 2000
            });
            return;
        }

        btn.innerText = "⏳";
        btn.disabled = true;
        btn.style.background = "#95a5a6";

        try {
            let driveLink = "";
            if (fileInput && fileInput.files.length > 0) {
                driveLink = await uploadFileToDrive(fileInput.files[0]) || "";
            }

            const payload = {
                Nhom_Hang: nhom,
                Ten_Hang: ten,
                Gia_Ban: giaBan,
                Gia_Si: 0,
                Don_Vi_Tinh: dvt,
                Mo_Ta: mota,
                Hinh_Anh: driveLink,
                Ma_QR: "SMP-" + Math.random().toString(36).substr(2, 6).toUpperCase(),
                Ghi_Chu: ""
            };

            const postHeaders = { 
                'apikey': window.SB_CONFIG.KEY, 
                'Authorization': `Bearer ${window.SB_CONFIG.KEY}`,
                'Content-Type': 'application/json',
                'Prefer': 'return=minimal'
            };

            const response = await fetch(`${window.SB_CONFIG.URL}/rest/v1/Bang_Gia_San_Pham`, {
                method: 'POST',
                headers: postHeaders,
                body: JSON.stringify(payload)
            });

            if (!response.ok) {
                const errInfo = await response.json();
                if (errInfo.code === '23505' || errInfo.message.includes('unique constraint')) {
                    throw new Error("Lỗi: Tên sản phẩm này đã tồn tại trong Bảng Giá!");
                }
                throw new Error(errInfo.message || "Cơ sở dữ liệu từ chối lưu!");
            }

            if (spId) {
                await fetch(`${window.SB_CONFIG.URL}/rest/v1/San_Pham_Cho_Duyet?id=eq.${spId}`, {
                    method: 'DELETE', headers: { 'apikey': window.SB_CONFIG.KEY, 'Authorization': `Bearer ${window.SB_CONFIG.KEY}` }
                });
            }

            try {
                const userObj = JSON.parse(localStorage.getItem('currentUser'));
                const userName = userObj?.Ho_Ten || userObj?.name || "Một tài khoản";
                const tbTitle = "THÊM SẢN PHẨM MỚI";
                const tbMsg = `${userName} vừa thêm sản phẩm ${ten} từ danh mục chờ duyệt vào bảng giá.`;
                
                if (typeof window.guiThongBaoSacMau === 'function') {
                    window.guiThongBaoSacMau(tbTitle, tbMsg, "Quan_Ly_Don", "Bang_Gia.html");
                } else if (typeof guiThongBaoSacMau === 'function') {
                    guiThongBaoSacMau(tbTitle, tbMsg, "Quan_Ly_Don", "Bang_Gia.html");
                }
            } catch (etb) { console.error("Lỗi gửi thông báo:", etb); }

            btn.innerText = "✔";
            btn.style.background = "#27ae60";
            
            setTimeout(() => {
                const row = document.getElementById(`dm-row-${index}`);
                if(row) row.style.display = 'none';
            }, 1000);

            loadPriceList();

        } catch (error) {
            btn.innerText = "✖";
            btn.disabled = false;
            btn.style.background = "#e74c3c";
            Swal.fire({
                toast: true, position: 'top-end', icon: 'error',
                title: error.message, showConfirmButton: false, timer: 3000
            });
        }
    }

    window.deleteItemFromDM = async function(index, id) {
        if (!id) {
            alert("Không tìm thấy ID sản phẩm để xóa!");
            return;
        }
        
        if (!confirm("Xác nhận xóa sản phẩm này hoàn toàn khỏi Danh Mục Chờ Duyệt?")) return;
        
        const delBtn = document.getElementById(`dm-del-btn-${index}`);
        delBtn.innerText = "⏳";
        delBtn.disabled = true;

        try {
            const h = { 'apikey': window.SB_CONFIG.KEY, 'Authorization': `Bearer ${window.SB_CONFIG.KEY}` };
            
            let response = await fetch(`${window.SB_CONFIG.URL}/rest/v1/San_Pham_Cho_Duyet?id=eq.${id}`, {
                method: 'DELETE',
                headers: h
            });

            if (!response.ok) {
                response = await fetch(`${window.SB_CONFIG.URL}/rest/v1/San_Pham_Cho_Duyet?Id=eq.${id}`, {
                    method: 'DELETE',
                    headers: h
                });
                if (!response.ok) throw new Error("Lỗi xóa từ Cơ sở dữ liệu");
            }

            const row = document.getElementById(`dm-row-${index}`);
            if(row) row.style.display = 'none';

        } catch (error) {
            delBtn.innerText = "✖";
            delBtn.disabled = false;
            alert(error.message);
        }
    }
  </script>
</body>
