<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quản lý Hóa Đơn - Sắc Màu</title>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="https://accounts.google.com/gsi/client" onload="initTokenClient()" async defer></script>
  
  <script src="js/config.js?v=2000"></script>
  <script src="js/auth_guard.js"></script>
  <script src="js/sidebar_loader.js?v=2000"></script>

  <style>
    body { margin: 0; background: #f0f4f8; display: flex; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    
    /* PC: Chừa lề sẵn 250px để trang KHÔNG bị giật khi load */
    .main-content { flex: 1; margin-left: 250px; transition: 0.3s; padding: 30px; min-width: 0; }

    /* Khung Giao Diện Chung */
    .sacmau-wrapper { max-width: 1200px; margin: auto; }
    .sacmau-container { background: white; padding: 25px; border-radius: 16px; box-shadow: 0 10px 30px rgba(0,0,0,0.05); margin-bottom: 25px; }
    
    h2.title { color: #2D5A27; margin-top: 0; margin-bottom: 20px; font-size: 22px; display: flex; align-items: center; gap: 10px; }

    /* Form Styles */
    .sacmau-input, .sacmau-select { 
      width: 100%; padding: 10px 14px; border: 1px solid #dce1e6; border-radius: 8px; box-sizing: border-box; 
      font-size: 14px; transition: 0.3s; background: #fff;
    }
    .sacmau-input:focus, .sacmau-select:focus { border-color: #2D5A27; outline: none; box-shadow: 0 0 0 3px rgba(45, 90, 39, 0.1); }
    .sacmau-label { display: block; font-size: 13px; font-weight: 600; color: #4a5568; margin-bottom: 6px; }
    .sacmau-row { display: flex; gap: 15px; margin-bottom: 15px; flex-wrap: wrap; }
    .col { flex: 1; min-width: 200px; }
    
    /* Nút lưu */
    .sacmau-btn-save { width: 100%; padding: 12px; background: linear-gradient(135deg, #2D5A27, #1e3f1a); color: white; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; transition: 0.2s; font-size: 15px; box-shadow: 0 4px 10px rgba(45, 90, 39, 0.2); }
    .sacmau-btn-save:hover { transform: translateY(-2px); box-shadow: 0 6px 15px rgba(45, 90, 39, 0.3); }

    /* Thống kê (Summary Cards) */
    .summary-container { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 25px; }
    .summary-card { padding: 20px; border-radius: 12px; display: flex; flex-direction: column; justify-content: center; box-shadow: 0 4px 15px rgba(0,0,0,0.05); border-left: 5px solid; background: white; }
    .summary-card.in { border-color: #e74c3c; } /* Đầu vào - Đỏ */
    .summary-card.out { border-color: #27ae60; } /* Đầu ra - Xanh */
    .summary-title { font-size: 14px; color: #7f8c8d; font-weight: 600; margin-bottom: 5px; text-transform: uppercase;}
    .summary-value { font-size: 26px; font-weight: 900; }
    .summary-card.in .summary-value { color: #c0392b; }
    .summary-card.out .summary-value { color: #2D5A27; }

    /* Bộ lọc */
    .filter-section { background: #f8fafc; padding: 15px; border-radius: 12px; border: 1px solid #edf2f7; display: flex; gap: 15px; align-items: flex-end; flex-wrap: wrap; margin-bottom: 15px;}
    .filter-col { flex: 1; min-width: 150px; }

    /* Bảng dữ liệu */
    .table-wrapper { max-height: 500px; overflow-y: auto; border: 1px solid #edf2f7; border-radius: 10px; box-shadow: inset 0 2px 4px rgba(0,0,0,0.02); }
    .sacmau-table { width: 100%; border-collapse: collapse; font-size: 13.5px; min-width: 900px; }
    .sacmau-table th { background: #2D5A27; color: white; padding: 12px; position: sticky; top: 0; z-index: 10; font-weight: 600; text-align: left; }
    .sacmau-table td { padding: 12px; border-bottom: 1px solid #edf2f7; vertical-align: middle; }
    .sacmau-table tr:hover { background-color: #f8fafc; }
    
    .badge { padding: 4px 8px; border-radius: 6px; font-size: 12px; font-weight: bold; }
    .badge.in { background: #fadbd8; color: #c0392b; }
    .badge.out { background: #d5f5e3; color: #1e8449; }
    .btn-link { background: #3498db; color: white; padding: 6px 12px; text-decoration: none; border-radius: 6px; font-size: 12px; font-weight: bold; }
    .btn-link:hover { background: #2980b9; }
    
    /* CSS cho nút Sửa */
    .btn-edit { background: #f39c12; color: white; padding: 6px 12px; border: none; text-decoration: none; border-radius: 6px; font-size: 12px; font-weight: bold; cursor: pointer; margin-left: 5px; transition: 0.2s; }
    .btn-edit:hover { background: #d68910; }

    @media (max-width: 768px) {
      .main-content { margin-left: 0 !important; padding: 15px; padding-top: 60px; }
      .summary-container { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

  <div class="main-content">
    
    <div class="header-top" style="display: flex; justify-content: flex-end; align-items: center; margin-bottom: 15px;">
      <button type="button" onclick="getToken()" style="background:#4285F4; color:white; border:none; padding:10px 20px; border-radius:20px; cursor:pointer; font-weight:bold; box-shadow: 0 2px 5px rgba(0,0,0,0.2);">🔐 KẾT NỐI DRIVE</button>
    </div>

    <div class="sacmau-wrapper">
      
      <div class="sacmau-container">
        <h2 class="title">📥 NHẬP HÓA ĐƠN CHỨNG TỪ</h2>
        
        <div class="sacmau-row">
          <div class="col">
            <label class="sacmau-label">Số Hóa Đơn</label>
            <input type="text" id="soHoaDon" class="sacmau-input" placeholder="Nhập số hóa đơn...">
          </div>
          <div class="col">
            <label class="sacmau-label">Ngày Hóa Đơn</label>
            <input type="date" id="ngayHoaDon" class="sacmau-input">
          </div>
          <div class="col">
            <label class="sacmau-label">Tên Khách / Đơn Vị</label>
            <input type="text" id="tenKhach" class="sacmau-input" placeholder="Tên đơn vị mua/bán...">
          </div>
        </div>

        <div class="sacmau-row">
          <div class="col">
            <label class="sacmau-label">Loại Hóa Đơn</label>
            <select id="loaiHoaDon" class="sacmau-select">
              <option value="Đầu vào">Đầu vào</option>
              <option value="Đầu ra">Đầu ra</option>
            </select>
          </div>
          <div class="col">
            <label class="sacmau-label">Số Tiền (VNĐ)</label>
            <input type="text" id="soTien" class="sacmau-input" placeholder="0" oninput="formatTien(this)">
          </div>
          <div class="col">
            <label class="sacmau-label">Ghi Chú</label>
            <input type="text" id="ghiChu" class="sacmau-input" placeholder="Ghi chú thêm...">
          </div>
        </div>

        <div class="sacmau-row" style="align-items: flex-end;">
          <div class="col" style="flex: 2;">
            <label class="sacmau-label">File Hóa Đơn (PDF, Ảnh...)</label>
            <input type="file" id="fileHoaDon" class="sacmau-input" style="padding: 7px;">
          </div>
          <div class="col" style="flex: 1;">
            <button class="sacmau-btn-save" onclick="luuHoaDon()">💾 LƯU & TẢI LÊN</button>
          </div>
        </div>
      </div>

      <div class="summary-container">
        <div class="summary-card in">
          <div class="summary-title">TỔNG TIỀN HÓA ĐƠN ĐẦU VÀO</div>
          <div class="summary-value" id="tongDauVao">0 đ</div>
        </div>
        <div class="summary-card out">
          <div class="summary-title">TỔNG TIỀN HÓA ĐƠN ĐẦU RA</div>
          <div class="summary-value" id="tongDauRa">0 đ</div>
        </div>
      </div>

      <div class="sacmau-container">
        <h2 class="title">📊 DANH SÁCH HÓA ĐƠN</h2>
        
        <div class="filter-section">
          <div class="filter-col" style="flex: 2;">
            <label class="sacmau-label">Tìm kiếm nhanh</label>
            <input type="text" id="searchBox" class="sacmau-input" placeholder="Tìm số HĐ, tên khách..." oninput="applyFilters()">
          </div>
          <div class="filter-col">
            <label class="sacmau-label">Lọc theo loại</label>
            <select id="filterLoai" class="sacmau-select" onchange="applyFilters()">
              <option value="">Tất cả</option>
              <option value="Đầu vào">Đầu vào</option>
              <option value="Đầu ra">Đầu ra</option>
            </select>
          </div>
          <div class="filter-col">
            <label class="sacmau-label">Lọc Tháng/Năm</label>
            <input type="month" id="filterThang" class="sacmau-input" onchange="applyFilters()">
          </div>
          <div class="filter-col" style="flex: 0.5;">
            <button onclick="clearFilters()" class="sacmau-input" style="background:#e2e8f0; cursor:pointer; height:40px;">Bỏ lọc</button>
          </div>
        </div>

        <div class="table-wrapper">
          <table class="sacmau-table">
            <thead>
              <tr>
                <th style="width: 50px;">ID</th>
                <th>Số HĐ</th>
                <th>Ngày HĐ</th>
                <th>Đơn Vị / Tên Khách</th>
                <th>Loại HĐ</th>
                <th style="text-align: right;">Số Tiền</th>
                <th>Ghi Chú</th>
                <th style="text-align: center;">File & Tác vụ</th>
              </tr>
            </thead>
            <tbody id="tableBody">
              <tr><td colspan="8" style="text-align:center;">Đang tải dữ liệu...</td></tr>
            </tbody>
          </table>
        </div>
      </div>

    </div>
  </div>

  <script>
    // --- GOOGLE DRIVE AUTH CONFIG ---
    const CLIENT_ID = "139226878812-nuf4fl5sp2gvofgsgu7krtm89iqqgon6.apps.googleusercontent.com";
    const FOLDER_DRIVE_ID = "1GTwI_ygHPGVuWxfpC-AnIsDeIaia8Nr3";
    let accessToken = localStorage.getItem('drive_token') || null;
    let tokenClient;

    function initTokenClient() {
        tokenClient = google.accounts.oauth2.initTokenClient({
            client_id: CLIENT_ID,
            scope: 'https://www.googleapis.com/auth/drive.file',
            callback: (res) => { 
                accessToken = res.access_token; 
                localStorage.setItem('drive_token', accessToken); 
                Swal.fire({ icon: 'success', title: 'Đã kết nối Google Drive!', timer: 1500, showConfirmButton: false });
            }
        });
    }

    function getToken() { 
        if(!tokenClient) initTokenClient();
        tokenClient.requestAccessToken(); 
    }
    // --------------------------------

    let danhSachHoaDon = [];
    const TABLE_NAME = "Hoa_Don"; // Sửa lại tên bảng của bạn nếu cần

    // Format tiền khi nhập
    function formatTien(el) {
      let v = el.value.replace(/\D/g, "");
      if (v !== "") el.value = Number(v).toLocaleString("vi-VN");
    }

    // Lấy số từ chuỗi định dạng
    function getRawNum(str) {
      if(!str) return 0;
      return Number(str.toString().replace(/\./g, "")) || 0;
    }

    // Load dữ liệu khi vào trang
    async function loadData() {
      const h = { 'apikey': SB_CONFIG.KEY, 'Authorization': `Bearer ${SB_CONFIG.KEY}` };
      try {
        const res = await fetch(`${SB_CONFIG.URL}/rest/v1/${TABLE_NAME}?select=*&order=id.desc`, { headers: h });
        if(!res.ok) throw new Error("Không thể tải dữ liệu.");
        danhSachHoaDon = await res.json();
        applyFilters(); 
      } catch (e) {
        console.error(e);
        document.getElementById("tableBody").innerHTML = `<tr><td colspan="8" style="text-align:center; color:red;">Lỗi tải dữ liệu. Kiểm tra lại tên bảng trong code.</td></tr>`;
      }
    }

    // Hàm render bảng và tính toán tổng tiền
    function renderTable(data) {
      const tbody = document.getElementById("tableBody");
      let tongVao = 0;
      let tongRa = 0;

      if(data.length === 0) {
        tbody.innerHTML = `<tr><td colspan="8" style="text-align:center;">Không có dữ liệu phù hợp.</td></tr>`;
      } else {
        tbody.innerHTML = data.map(item => {
          let soTien = getRawNum(item.So_Tien);
          
          if (item.Loai_Hoa_Don === "Đầu vào") tongVao += soTien;
          if (item.Loai_Hoa_Don === "Đầu ra") tongRa += soTien;

          let badgeClass = item.Loai_Hoa_Don === "Đầu vào" ? "in" : "out";
          let linkHienThi = item.Link_Hoa_Don ? `<a href="${item.Link_Hoa_Don}" target="_blank" class="btn-link">📁 Xem File</a>` : "---";
          let btnSua = `<button onclick="editHoaDon(${item.id})" class="btn-edit">✏️ Sửa</button>`;

          return `
            <tr>
              <td>${item.id}</td>
              <td style="font-weight:bold;">${item.So_Hoa_Don || ""}</td>
              <td>${item.Ngay_Hoa_Don ? item.Ngay_Hoa_Don.split("-").reverse().join("/") : ""}</td>
              <td>${item.Ten_Khach || ""}</td>
              <td><span class="badge ${badgeClass}">${item.Loai_Hoa_Don || ""}</span></td>
              <td style="text-align: right; font-weight: bold; color: ${item.Loai_Hoa_Don === 'Đầu vào' ? '#c0392b' : '#2D5A27'}">${soTien.toLocaleString("vi-VN")} đ</td>
              <td>${item.Ghi_Chu || ""}</td>
              <td style="text-align: center;">${linkHienThi} ${btnSua}</td>
            </tr>
          `;
        }).join("");
      }

      // Cập nhật thẻ thống kê
      document.getElementById("tongDauVao").innerText = tongVao.toLocaleString("vi-VN") + " đ";
      document.getElementById("tongDauRa").innerText = tongRa.toLocaleString("vi-VN") + " đ";
    }

    // Chức năng lọc dữ liệu
    function applyFilters() {
      const searchTxt = document.getElementById("searchBox").value.toLowerCase().trim();
      const typeVal = document.getElementById("filterLoai").value;
      const monthVal = document.getElementById("filterThang").value; 

      const filtered = danhSachHoaDon.filter(item => {
        let matchSearch = true;
        if(searchTxt) {
           let txt = (item.So_Hoa_Don + " " + item.Ten_Khach).toLowerCase();
           matchSearch = txt.includes(searchTxt);
        }
        
        let matchType = typeVal ? item.Loai_Hoa_Don === typeVal : true;
        
        let matchMonth = true;
        if(monthVal && item.Ngay_Hoa_Don) {
           matchMonth = item.Ngay_Hoa_Don.startsWith(monthVal);
        }

        return matchSearch && matchType && matchMonth;
      });

      renderTable(filtered);
    }

    // Bỏ lọc
    function clearFilters() {
      document.getElementById("searchBox").value = "";
      document.getElementById("filterLoai").value = "";
      document.getElementById("filterThang").value = "";
      applyFilters();
    }

    // Hàm Upload File Lên Drive sử dụng Token Client (OAuth2)
    async function uploadFileToDrive(file, fileName) {
        return new Promise(async (resolve, reject) => {
            if (!accessToken) {
                return reject(new Error("Phiên đăng nhập hết hạn hoặc chưa kết nối Drive!"));
            }

            const metadata = { name: fileName, parents: [FOLDER_DRIVE_ID] };
            try {
                // Khởi tạo resumable upload
                const resInit = await fetch('https://www.googleapis.com/upload/drive/v3/files?uploadType=resumable&supportsAllDrives=true', {
                    method: 'POST',
                    headers: { 'Authorization': `Bearer ${accessToken}`, 'Content-Type': 'application/json' },
                    body: JSON.stringify(metadata)
                });

                if (resInit.status === 401) { 
                    accessToken = null; localStorage.removeItem('drive_token'); 
                    return reject(new Error("Token hết hạn. Vui lòng nhấn KẾT NỐI DRIVE."));
                }
                
                const uploadUrl = resInit.headers.get('Location');

                // Thực hiện PUT file
                const xhr = new XMLHttpRequest();
                xhr.open('PUT', uploadUrl, true);
                xhr.upload.onprogress = (e) => {
                    if (e.lengthComputable) {
                        const percent = Math.round((e.loaded / e.total) * 100);
                        Swal.update({ title: `Đang tải lên: ${percent}%` });
                    }
                };
                
                xhr.onload = function() {
                    if (xhr.status === 200 || xhr.status === 201) {
                        const result = JSON.parse(xhr.responseText);
                        const fileLink = `https://drive.google.com/file/d/${result.id}/view`;
                        resolve(fileLink);
                    } else {
                        reject(new Error("Lỗi khi tải file lên Drive."));
                    }
                };
                xhr.onerror = () => reject(new Error("Lỗi mạng khi tải lên."));
                xhr.send(file);
            } catch(e) {
                reject(e);
            }
        });
    }

    // Hàm Lưu và Upload Hóa Đơn
    async function luuHoaDon() {
      const soHoaDon = document.getElementById("soHoaDon").value.trim();
      const ngayHoaDon = document.getElementById("ngayHoaDon").value;
      const tenKhach = document.getElementById("tenKhach").value.trim();
      const loaiHoaDon = document.getElementById("loaiHoaDon").value;
      const soTien = document.getElementById("soTien").value;
      const ghiChu = document.getElementById("ghiChu").value.trim();
      const fileInput = document.getElementById("fileHoaDon");

      if(!soHoaDon || !ngayHoaDon || !soTien) {
        return Swal.fire("Lỗi", "Vui lòng nhập Số hóa đơn, Ngày và Số tiền!", "warning");
      }

      if (fileInput.files.length > 0 && !accessToken) {
         return Swal.fire("Lỗi", "Vui lòng nhấn KẾT NỐI DRIVE để có thể tải file lên!", "warning");
      }

      Swal.fire({ title: 'Đang xử lý...', html: 'Đang lưu dữ liệu...', allowOutsideClick: false, didOpen: () => Swal.showLoading() });

      let linkDrive = "";

      try {
        // 1. Upload file trực tiếp lên Drive qua API nếu có
        if (fileInput.files.length > 0) {
          const file = fileInput.files[0];
          const fileName = `HoaDon_${loaiHoaDon}_${soHoaDon}_${file.name}`;
          linkDrive = await uploadFileToDrive(file, fileName);
        }

        // 2. Lưu vào Supabase
        const payload = {
          So_Hoa_Don: soHoaDon,
          Ngay_Hoa_Don: ngayHoaDon,
          Ten_Khach: tenKhach,
          Loai_Hoa_Don: loaiHoaDon,
          So_Tien: soTien,
          Ghi_Chu: ghiChu,
          Link_Hoa_Don: linkDrive
        };

        const h = { 'apikey': SB_CONFIG.KEY, 'Authorization': `Bearer ${SB_CONFIG.KEY}`, 'Content-Type': 'application/json', 'Prefer': 'return=minimal' };
        
        const saveRes = await fetch(`${SB_CONFIG.URL}/rest/v1/${TABLE_NAME}`, {
          method: 'POST',
          headers: h,
          body: JSON.stringify(payload)
        });

        if(!saveRes.ok) throw new Error("Lỗi khi lưu vào cơ sở dữ liệu");

        Swal.fire('Thành công', 'Đã lưu hóa đơn thành công!', 'success');
        
        // Reset form
        ["soHoaDon", "ngayHoaDon", "tenKhach", "soTien", "ghiChu", "fileHoaDon"].forEach(id => document.getElementById(id).value = "");
        
        // Load lại bảng
        loadData();

      } catch (err) {
        console.error(err);
        Swal.fire('Lỗi', err.message, 'error');
      }
    }

    // Hàm Chỉnh sửa Hóa Đơn
    async function editHoaDon(id) {
      const item = danhSachHoaDon.find(x => x.id === id);
      if (!item) return;

      const { value: formValues } = await Swal.fire({
        title: 'Chỉnh sửa Hóa Đơn',
        html: `
          <div style="text-align: left; font-size: 14px;">
            <div style="margin-bottom: 10px;"><b>Số Hóa Đơn:</b> <input id="swal-so" class="swal2-input" style="margin: 5px 0; width: 100%; box-sizing: border-box;" value="${item.So_Hoa_Don || ''}"></div>
            <div style="margin-bottom: 10px;"><b>Ngày Hóa Đơn:</b> <input id="swal-ngay" type="date" class="swal2-input" style="margin: 5px 0; width: 100%; box-sizing: border-box;" value="${item.Ngay_Hoa_Don || ''}"></div>
            <div style="margin-bottom: 10px;"><b>Tên Khách:</b> <input id="swal-khach" class="swal2-input" style="margin: 5px 0; width: 100%; box-sizing: border-box;" value="${item.Ten_Khach || ''}"></div>
            <div style="margin-bottom: 10px;"><b>Loại Hóa Đơn:</b> 
              <select id="swal-loai" class="swal2-input" style="margin: 5px 0; width: 100%; box-sizing: border-box;">
                <option value="Đầu vào" ${item.Loai_Hoa_Don === 'Đầu vào' ? 'selected' : ''}>Đầu vào</option>
                <option value="Đầu ra" ${item.Loai_Hoa_Don === 'Đầu ra' ? 'selected' : ''}>Đầu ra</option>
              </select>
            </div>
            <div style="margin-bottom: 10px;"><b>Số Tiền:</b> <input id="swal-tien" class="swal2-input" style="margin: 5px 0; width: 100%; box-sizing: border-box;" value="${item.So_Tien || ''}" oninput="formatTien(this)"></div>
            <div style="margin-bottom: 10px;"><b>Ghi Chú:</b> <input id="swal-ghi" class="swal2-input" style="margin: 5px 0; width: 100%; box-sizing: border-box;" value="${item.Ghi_Chu || ''}"></div>
          </div>
        `,
        focusConfirm: false,
        showCancelButton: true,
        confirmButtonText: 'Lưu thay đổi',
        cancelButtonText: 'Hủy bỏ',
        confirmButtonColor: '#2D5A27',
        preConfirm: () => {
          return {
            So_Hoa_Don: document.getElementById('swal-so').value.trim(),
            Ngay_Hoa_Don: document.getElementById('swal-ngay').value,
            Ten_Khach: document.getElementById('swal-khach').value.trim(),
            Loai_Hoa_Don: document.getElementById('swal-loai').value,
            So_Tien: document.getElementById('swal-tien').value,
            Ghi_Chu: document.getElementById('swal-ghi').value.trim()
          }
        }
      });

      if (formValues) {
        Swal.fire({ title: 'Đang cập nhật...', allowOutsideClick: false, didOpen: () => Swal.showLoading() });
        const h = { 'apikey': SB_CONFIG.KEY, 'Authorization': `Bearer ${SB_CONFIG.KEY}`, 'Content-Type': 'application/json', 'Prefer': 'return=minimal' };
        
        try {
          const res = await fetch(`${SB_CONFIG.URL}/rest/v1/${TABLE_NAME}?id=eq.${id}`, {
            method: 'PATCH',
            headers: h,
            body: JSON.stringify(formValues)
          });
          
          if (!res.ok) throw new Error("Lỗi khi cập nhật dữ liệu");
          
          Swal.fire({ toast: true, position: 'top-end', icon: 'success', title: 'Cập nhật thành công!', showConfirmButton: false, timer: 1500 });
          loadData(); // Tải lại bảng ngay lập tức
        } catch(e) {
           console.error(e);
           Swal.fire('Lỗi', e.message, 'error');
        }
      }
    }

    // Chạy khi mở trang
    window.onload = loadData;
  </script>
</body>
</html>
